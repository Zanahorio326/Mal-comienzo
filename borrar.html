<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reemplazo de Palabras</title>
    <style>
        .floating-card {
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 80%;
            min-width: 300px;
            display: none;
            z-index: 1000;
            font-family: Arial, sans-serif;
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let alertQueue = []; // Cola de alertas para mostrar
        let alertIndex = 0;

        function mostrarAlertas() {
            const alerta = document.getElementById("alerta");
            if (alertIndex < alertQueue.length) {
                alerta.textContent = alertQueue[alertIndex];
                alerta.style.display = "block";
                alertIndex++;

                // Ocultar después de medio segundo
                setTimeout(() => {
                    alerta.style.display = "none";
                    mostrarAlertas(); // Llamar nuevamente para mostrar la siguiente alerta
                }, 500); // Medio segundo
            }
        }

        function reemplazarPalabras() {
            agregarAlerta("Accediendo a la base de datos...");

            const itemsIncorrectos = {
                "carbon": "Carbón",
                "Carbon": "Carbón",
                "carbón": "Carbón",
                "cobre": "Cobre",
                "cobré": "Cobre",
                "hierro": "Hierro",
                "hirro": "Hierro",
                "plata": "Plata",
                "platta": "Plata",
                "oro": "Oro",
                "madera": "Madera",
                "maderra": "Madera",
                "piedra": "Piedra",
                "piedrita": "Piedra"
            };

            const usersRef = ref(db, 'users');

            get(usersRef).then((snapshot) => {
                if (snapshot.exists()) {
                    agregarAlerta("Base de datos encontrada. Buscando palabras...");

                    const users = snapshot.val();
                    let cambiosRealizados = 0;
                    let todasLasPalabras = [];

                    for (const username in users) {
                        if (users[username].inventory) {
                            let inventory = users[username].inventory;
                            let inventoryUpdated = false;
                            let nuevoInventario = {};

                            for (const item in inventory) {
                                let cantidad = inventory[item]; // Cantidad del ítem
                                todasLasPalabras.push(item); // Guardar el nombre del ítem

                                let itemLimpio = item.trim().toLowerCase();
                                if (itemsIncorrectos[itemLimpio]) {
                                    const nuevoNombre = itemsIncorrectos[itemLimpio];
                                    agregarAlerta(`Corrigiendo "${item}" por "${nuevoNombre}" en el usuario ${username}`);
                                    nuevoInventario[nuevoNombre] = cantidad; // Guardar con el nombre corregido
                                    inventoryUpdated = true;
                                    cambiosRealizados++;
                                } else {
                                    nuevoInventario[item] = cantidad; // Mantener el ítem original si no necesita cambio
                                }
                            }

                            // Si hubo cambios, subir el inventario actualizado
                            if (inventoryUpdated) {
                                set(ref(db, `users/${username}/inventory`), nuevoInventario).then(() => {
                                    agregarAlerta(`Inventario de ${username} actualizado en la base de datos.`);
                                }).catch((error) => {
                                    agregarAlerta(`Error al actualizar el inventario de ${username}: ${error}`);
                                });
                            }
                        }
                    }

                    // Nueva alerta con TODAS las palabras encontradas en la base de datos
                    agregarAlerta("Palabras encontradas en la base de datos:\n" + todasLasPalabras.join(", "));

                    if (cambiosRealizados > 0) {
                        agregarAlerta(`Reemplazo completado. Total de cambios: ${cambiosRealizados}`);
                    } else {
                        agregarAlerta("No se encontraron palabras incorrectas para reemplazar.");
                    }
                } else {
                    agregarAlerta("No se encontraron usuarios en la base de datos.");
                }
                listarJugadores(); // Actualizar la lista después del reemplazo
            }).catch((error) => {
                agregarAlerta("Error al acceder a la base de datos: " + error);
            });
        }

        function agregarAlerta(mensaje) {
            alertQueue.push(mensaje);
            if (alertQueue.length === 1) {
                mostrarAlertas(); // Si es la primera alerta, comienza el proceso
            }
        }

        function listarJugadores() {
            const usersRef = ref(db, 'users');

            get(usersRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const users = snapshot.val();
                    const listaJugadores = document.getElementById("listaJugadores");
                    listaJugadores.innerHTML = ""; // Limpiar lista antes de actualizar

                    for (const username in users) {
                        const li = document.createElement("li");
                        li.textContent = `${username} → ${JSON.stringify(users[username].inventory)}`;
                        listaJugadores.appendChild(li);
                    }
                } else {
                    agregarAlerta("No se encontraron usuarios en la base de datos.");
                }
            }).catch((error) => {
                agregarAlerta("Error al acceder a la base de datos: " + error);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("reemplazarBtn").addEventListener("click", reemplazarPalabras);
            listarJugadores(); // Llamar a la función para listar jugadores al cargar la página
        });
    </script>
</head>
<body>
    <button id="reemplazarBtn">Reemplazar Palabras Incorrectas</button>
    <h3>Lista de Jugadores</h3>
    <ul id="listaJugadores"></ul>

    <!-- Tarjeta flotante para las alertas -->
    <div id="alerta" class="floating-card"></div>
</body>
</html>
