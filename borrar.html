<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrección de Inventario</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            databaseURL: "TU_DATABASE_URL",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const correcciones = {
            "carbon": "Carbón",
            "Carbon": "Carbón",
            "carbón": "Carbón",
            "madera": "Madera",
            "Madera ": "Madera",
            "madrera": "Madera",
            "hierro ": "Hierro",
            "Hierro ": "Hierro",
            "hierroo": "Hierro",
            "oro ": "Oro",
            "Oro ": "Oro",
            "plata ": "Plata",
            "Plata ": "Plata",
            "cobre ": "Cobre",
            "Cobre ": "Cobre"
        };

        document.addEventListener("DOMContentLoaded", () => {
            const botonCorregir = document.getElementById("corregirInventario");
            botonCorregir.addEventListener("click", async () => {
                let mensajes = [];
                mensajes.push("Accediendo a la base de datos...");

                const inventarioRef = ref(db, "inventario");
                const snapshot = await get(inventarioRef);

                if (!snapshot.exists()) {
                    mensajes.push("No se encontró inventario.");
                    mostrarMensajes(mensajes);
                    return;
                }

                let updates = {};
                let itemsModificados = [];

                snapshot.forEach(usuarioSnapshot => {
                    const userId = usuarioSnapshot.key;
                    const inventario = usuarioSnapshot.val();

                    let cambios = { ...inventario };  

                    for (let item in inventario) {
                        let cantidad = inventario[item];

                        if (correcciones[item]) {
                            let itemCorregido = correcciones[item];

                            if (cambios[itemCorregido]) {
                                cambios[itemCorregido] += cantidad;
                            } else {
                                cambios[itemCorregido] = cantidad;
                            }

                            delete cambios[item];  
                            itemsModificados.push(`${userId}: ${item} → ${itemCorregido} (${cantidad})`);
                        }
                    }

                    updates[`inventario/${userId}`] = cambios;
                });

                if (Object.keys(updates).length > 0) {
                    await update(ref(db), updates);
                    mensajes.push("Se han corregido los nombres de los ítems.");
                } else {
                    mensajes.push("No se encontraron errores en los ítems.");
                }

                if (itemsModificados.length > 0) {
                    mensajes.push(`Palabras corregidas: ${itemsModificados.join(", ")}`);
                }

                mostrarMensajes(mensajes);
            });
        });

        function mostrarMensajes(mensajes) {
            const mensajeDiv = document.getElementById("mensaje");
            let index = 0;

            function mostrarSiguiente() {
                if (index < mensajes.length) {
                    mensajeDiv.textContent = mensajes[index];
                    index++;
                    setTimeout(mostrarSiguiente, 500);
                }
            }

            mostrarSiguiente();
        }
    </script>
</head>
<body>
    <button id="corregirInventario">Corregir Inventario</button>
    <div id="mensaje" style="margin-top: 10px; font-weight: bold;"></div>
</body>
</html>
