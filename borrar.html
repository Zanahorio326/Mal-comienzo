<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrar Cuenta y Datos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        button {
            padding: 10px 20px;
            background-color: #FF6347;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #E53E3E;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Eliminar Cuenta y Datos</h2>
        <p>Al hacer clic en "Eliminar cuenta", se borrarán todos los datos asociados a tu cuenta de Firebase y tu cuenta de usuario.</p>
        <button onclick="eliminarCuenta()">Eliminar Cuenta</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, deleteUser } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getDatabase, ref, remove } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        function eliminarCuenta() {
            const user = auth.currentUser;
            if (user) {
                // Eliminar los datos del usuario en la base de datos
                const userRef = ref(db, 'usuarios/' + user.uid);
                remove(userRef)
                    .then(() => {
                        console.log('Datos eliminados correctamente');
                    })
                    .catch((error) => {
                        console.error('Error al eliminar los datos:', error);
                    });

                // Eliminar la cuenta del usuario
                deleteUser(user).then(() => {
                    console.log('Cuenta eliminada correctamente');
                    alert('Tu cuenta y todos los datos asociados han sido eliminados.');
                    window.location.href = "index.html"; // Redirigir a la página principal después de eliminar la cuenta
                }).catch((error) => {
                    console.error('Error al eliminar la cuenta:', error);
                    alert('Ocurrió un error al eliminar tu cuenta.');
                });
            } else {
                alert('No hay usuario autenticado.');
            }
        }
    </script>
</body>
</html>
