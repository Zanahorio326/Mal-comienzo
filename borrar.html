<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Inventarios</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicialización de Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Función para realizar los cambios en el inventario
        function corregirInventario() {
            const usersRef = ref(db, 'users/');
            
            // Obtener todos los usuarios
            get(usersRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const users = snapshot.val();
                    const updates = {};

                    // Iterar sobre todos los usuarios
                    for (const username in users) {
                        const user = users[username];
                        const inventory = user.inventory || {};

                        // Realizar cambios en cada ítem
                        updates[`users/${username}/inventory/Carbón`] = inventory.Carbón ? inventory.Carbón.replace(/carbon/g, 'Carbón').replace(/CARBON/g, 'Carbón') : undefined;
                        updates[`users/${username}/inventory/Cobre`] = inventory.Cobre ? inventory.Cobre.replace(/cobre/g, 'Cobre').replace(/COBRE/g, 'Cobre') : undefined;
                        updates[`users/${username}/inventory/Hierro`] = inventory.Hierro ? inventory.Hierro.replace(/hierro/g, 'Hierro').replace(/HIERRO/g, 'Hierro') : undefined;
                        updates[`users/${username}/inventory/Plata`] = inventory.Plata ? inventory.Plata.replace(/plata/g, 'Plata').replace(/PLATA/g, 'Plata') : undefined;
                        updates[`users/${username}/inventory/Oro`] = inventory.Oro ? inventory.Oro.replace(/oro/g, 'Oro').replace(/ORO/g, 'Oro') : undefined;
                        updates[`users/${username}/inventory/Madera`] = inventory.Madera ? inventory.Madera.replace(/madera/g, 'Madera').replace(/MADERA/g, 'Madera') : undefined;
                    }

                    // Actualizar todos los inventarios
                    update(ref(db), updates).then(() => {
                        alert("Todos los inventarios han sido actualizados correctamente.");
                    }).catch((error) => {
                        console.error("Error al actualizar los inventarios: ", error);
                    });
                } else {
                    console.log("No se encontraron datos de usuarios.");
                }
            }).catch((error) => {
                console.error("Error al obtener los usuarios: ", error);
            });
        }
    </script>
</head>
<body>
    <h1>Actualizar Inventarios de Todos los Usuarios</h1>
    <button onclick="corregirInventario()">Corregir Inventarios</button>
</body>
</html>
