<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reemplazar Palabras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom right, #28a745, #f39c12);
            color: #333;
        }

        h1 {
            text-align: center;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>Reemplazar Palabras en Inventarios</h1>
    <div class="container">
        <button id="reemplazarBtn">Reemplazar Palabras Incorrectas</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicialización de Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Función para reemplazar palabras incorrectas por las correctas en todos los usuarios
        function reemplazarPalabras() {
            const itemsIncorrectos = {
                "carbon": "Carbón",
                "cobre": "Cobre",
                "hierro": "Hierro",
                "plata": "Plata",
                "oro": "Oro",
                "madera": "Madera"
            };

            // Obtener todos los usuarios
            const usersRef = ref(db, 'users');

            get(usersRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const users = snapshot.val();
                    for (const username in users) {
                        const userInventory = users[username].inventory;

                        // Reemplazar las palabras incorrectas en el inventario del usuario
                        for (const item in userInventory) {
                            const itemValue = userInventory[item];
                            if (itemValue && typeof itemValue === 'string') {
                                for (const incorrecta in itemsIncorrectos) {
                                    if (itemValue.toLowerCase() === incorrecta) {
                                        // Reemplazar la palabra incorrecta por la correcta
                                        userInventory[item] = itemsIncorrectos[incorrecta];
                                    }
                                }
                            }
                        }

                        // Actualizar el inventario con las palabras corregidas
                        set(ref(db, 'users/' + username + '/inventory'), userInventory);
                    }
                    alert("Las palabras incorrectas han sido reemplazadas en todos los inventarios.");
                } else {
                    console.log("No se encontraron usuarios.");
                }
            }).catch((error) => {
                console.error("Error al obtener los usuarios: ", error);
            });
        }

        // Agregar el evento al botón
        document.getElementById("reemplazarBtn").addEventListener("click", reemplazarPalabras);
    </script>
</body>
</html>
