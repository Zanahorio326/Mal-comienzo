<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reemplazo de Palabras</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicialización de Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function reemplazarPalabras() {
            alert("Accediendo a la base de datos...");

            const itemsIncorrectos = {
                "carbon": "Carbón",
                "cobre": "Cobre",
                "hierro": "Hierro",
                "plata": "Plata",
                "oro": "Oro",
                "madera": "Madera"
            };

            const usersRef = ref(db, 'users');

            get(usersRef).then((snapshot) => {
                if (snapshot.exists()) {
                    alert("Base de datos encontrada. Buscando palabras incorrectas...");
                    const users = snapshot.val();
                    let cambiosRealizados = 0;

                    for (const username in users) {
                        const userInventory = users[username].inventory;

                        if (userInventory) {
                            for (const item in userInventory) {
                                const itemValue = userInventory[item];
                                if (typeof itemValue === 'string' && itemsIncorrectos[itemValue.toLowerCase()]) {
                                    alert(`Reemplazando "${itemValue}" por "${itemsIncorrectos[itemValue.toLowerCase()]}" en el usuario ${username}`);
                                    userInventory[item] = itemsIncorrectos[itemValue.toLowerCase()];
                                    cambiosRealizados++;
                                }
                            }
                        }

                        set(ref(db, 'users/' + username + '/inventory'), userInventory);
                    }

                    if (cambiosRealizados > 0) {
                        alert(`Reemplazo completado. Total de cambios: ${cambiosRealizados}`);
                    } else {
                        alert("No se encontraron palabras incorrectas para reemplazar.");
                    }
                } else {
                    alert("No se encontraron usuarios en la base de datos.");
                }
            }).catch((error) => {
                alert("Error al acceder a la base de datos: " + error);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("reemplazarBtn").addEventListener("click", reemplazarPalabras);
        });
    </script>
</head>
<body>
    <button id="reemplazarBtn">Reemplazar Palabras Incorrectas</button>
</body>
</html>
