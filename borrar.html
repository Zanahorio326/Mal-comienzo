<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochila</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom right, #28a745, #f39c12);
            color: #333;
        }

        h1, h3 {
            text-align: center;
            color: #fff;
        }

        #mochila {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        p {
            font-size: 1.2em;
            margin: 10px 0;
            padding: 10px;
            background-color: #f1f1f1;
            border-radius: 4px;
        }

        p:nth-child(odd) {
            background-color: #e7e7e7;
        }

        h1 {
            font-size: 2em;
            color: #2c3e50;
            margin-top: 20px;
        }

        h3 {
            font-size: 1.5em;
            color: #2980b9;
        }

        .button {
            background-color: #2980b9;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            display: block;
            margin: 20px auto;
        }

        .button:hover {
            background-color: #3498db;
        }
    </style>
</head>
<body>
    <h1>Mochila</h1>
    <div id="mochila">
        <h3>Inventario</h3>
        <p id="Carbón">Carbón: 🔒</p>
        <p id="Cobre">Cobre: 🔒</p>
        <p id="Hierro">Hierro: 🔒</p>
        <p id="Plata">Plata: 🔒</p>
        <p id="Oro">Oro: 🔒</p>
        <p id="Madera">Madera: 🔒</p>

        <!-- Botón para cambiar el texto -->
        <button class="button" onclick="cambiarInventario()">Actualizar Inventario</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const username = localStorage.getItem("username") || "Desconocido";
        const userRef = ref(db, 'users/' + username);

        function cambiarInventario() {
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const inventory = snapshot.val().inventory || {};

                    // Función para estandarizar las palabras
                    const corregirPalabras = (texto) => {
                        const mapaCorrecciones = {
                            "carbon": "Carbón",
                            "cobre": "Cobre",
                            "hierro": "Hierro",
                            "plata": "Plata",
                            "oro": "Oro",
                            "madera": "Madera"
                        };

                        return mapaCorrecciones[texto.toLowerCase()] || texto;
                    };

                    // Reemplazar los valores en el inventario
                    document.getElementById("Carbón").textContent = inventory.Carbón ? `Carbón: ${corregirPalabras(inventory.Carbón)}` : "Carbón: 🔒";
                    document.getElementById("Cobre").textContent = inventory.Cobre ? `Cobre: ${corregirPalabras(inventory.Cobre)}` : "Cobre: 🔒";
                    document.getElementById("Hierro").textContent = inventory.Hierro ? `Hierro: ${corregirPalabras(inventory.Hierro)}` : "Hierro: 🔒";
                    document.getElementById("Plata").textContent = inventory.Plata ? `Plata: ${corregirPalabras(inventory.Plata)}` : "Plata: 🔒";
                    document.getElementById("Oro").textContent = inventory.Oro ? `Oro: ${corregirPalabras(inventory.Oro)}` : "Oro: 🔒";
                    document.getElementById("Madera").textContent = inventory.Madera ? `Madera: ${corregirPalabras(inventory.Madera)}` : "Madera: 🔒";
                } else {
                    console.log("No se encontraron datos para el usuario.");
                }
            }).catch((error) => {
                console.error("Error al obtener el inventario: ", error);
            });
        }

        // Llamar a la función de mostrar inventario al cargar la página
        document.addEventListener("DOMContentLoaded", function() {
            cambiarInventario(); // Opcional, para que se actualice al inicio
        });
    </script>
</body>
</html>
