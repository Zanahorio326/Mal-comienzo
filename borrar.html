<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Inventario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        p {
            font-size: 1.5em;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Inventario</h1>
    <p id="carbón">carbon: 10</p>
    <p id="cobre">cobre: 5</p>
    <p id="hierro">hierra: 3</p>
    <p id="plata">plata: 8</p>
    <p id="oro">oro: 2</p>
    <p id="madera">madera: 15</p>

    <button onclick="corregirInventario()">Corregir Inventario</button>

    <script>
        // Función que corrige los textos
        function corregirInventario() {
            // Objeto con los reemplazos
            const cambios = {
                "carbon": "Carbón",
                "carbono": "Carbón",
                "carbones": "Carbón",
                "carbón": "Carbón",
                "cobre": "Cobre",
                "cobres": "Cobre",
                "coobre": "Cobre",
                "cobrees": "Cobre",
                "hierro": "Hierro",
                "hierra": "Hierro",
                "hiero": "Hierro",
                "plata": "Plata",
                "plat": "Plata",
                "platA": "Plata",
                "oro": "Oro",
                "Oro": "Oro",
                "madera": "Madera",
                "maderas": "Madera",
                "maderaa": "Madera"
            };

            // Reemplazo de texto en cada elemento
            document.getElementById("carbón").textContent = document.getElementById("carbón").textContent.replace(/carbones?/gi, cambios["carbon"]);
            document.getElementById("carbón").textContent = document.getElementById("carbón").textContent.replace(/carbono?/gi, cambios["carbon"]);
            document.getElementById("carbón").textContent = document.getElementById("carbón").textContent.replace(/carbón/gi, cambios["carbon"]);

            document.getElementById("cobre").textContent = document.getElementById("cobre").textContent.replace(/cobres?/gi, cambios["cobre"]);
            document.getElementById("cobre").textContent = document.getElementById("cobre").textContent.replace(/coobre/gi, cambios["cobre"]);
            document.getElementById("cobre").textContent = document.getElementById("cobre").textContent.replace(/cobrees?/gi, cambios["cobre"]);

            document.getElementById("hierro").textContent = document.getElementById("hierro").textContent.replace(/hierra/gi, cambios["hierro"]);
            document.getElementById("hierro").textContent = document.getElementById("hierro").textContent.replace(/hiero/gi, cambios["hierro"]);

            document.getElementById("plata").textContent = document.getElementById("plata").textContent.replace(/platA/gi, cambios["plata"]);
            document.getElementById("plata").textContent = document.getElementById("plata").textContent.replace(/plat/gi, cambios["plata"]);

            document.getElementById("oro").textContent = document.getElementById("oro").textContent.replace(/Oro/gi, cambios["oro"]);
            document.getElementById("oro").textContent = document.getElementById("oro").textContent.replace(/oro/gi, cambios["oro"]);

            document.getElementById("madera").textContent = document.getElementById("madera").textContent.replace(/maderas?/gi, cambios["madera"]);
            document.getElementById("madera").textContent = document.getElementById("madera").textContent.replace(/maderaa/gi, cambios["madera"]);
        }
    </script>
</body>
</html>
