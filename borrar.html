<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar Inventarios</title>
</head>
<body>
  <!-- Botón para actualizar los inventarios -->
  <button onclick="actualizarInventarios()">Actualizar Inventarios</button>

  <script>
    // Arreglo de inventarios (cada objeto representa un inventario)
    let inventarios = [
      { "Carbón": 5, "Cobre": 2, "Hierro": 1, "Madera": 2, "Oro": 1, "Plata": 1 },
      { "carbón": 5, "cobre": 1 },
      { "Cobre": 2, "carbón": 1 },
      { "Cobre": 3 },
      { "Carbón": 5 },
      { "Cobre": 3, "Hierro": 1 },
      { "Cobre": 2 },
      { "Carbón": 11, "Cobre": 0, "Madera": 0, "Plata": 1 }
    ];

    // Mapa de variaciones de ítems a su forma correcta
    const itemsCorrectos = {
      "Carbón": ["carbón", "Carbon", "CARBÓN", "carbon", "CARbon", "CArbón"],
      "Cobre": ["cobre", "COBRE", "CObre", "cObre"],
      "Hierro": ["hierro", "HIERRO", "HiErRo", "hiErRo"],
      "Madera": ["madera", "MADERA", "MaDeRa", "mAdErA"],
      "Oro": ["oro", "ORO", "OrO", "oRo"],
      "Plata": ["plata", "PLATA", "PlAtA", "pLaTa"]
    };

    // Función para actualizar todos los inventarios
    function actualizarInventarios() {
      inventarios.forEach(inventario => {
        for (let itemCorrecto in itemsCorrectos) {
          itemsCorrectos[itemCorrecto].forEach(variacion => {
            if (inventario.hasOwnProperty(variacion)) {
              inventario[itemCorrecto] = inventario[variacion];
              delete inventario[variacion];
            }
          });
        }
      });
      console.log("Inventarios actualizados:", inventarios);
    }
  </script>
</body>
</html>
