<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corregir Inventarios</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicialización de Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Función para corregir los inventarios de todos los usuarios
        function corregirInventarios() {
            // Referencia a todos los usuarios
            const usersRef = ref(db, 'users/');
            
            get(usersRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const users = snapshot.val();
                    
                    // Iterar sobre todos los usuarios
                    for (const username in users) {
                        const inventory = users[username].inventory;

                        // Corregir los nombres de los items en el inventario
                        if (inventory) {
                            for (const item in inventory) {
                                let correctedItem = inventory[item];

                                // Corrección de palabras incorrectas
                                if (correctedItem.toLowerCase() === 'carbon') {
                                    correctedItem = 'Carbón';
                                } else if (correctedItem.toLowerCase() === 'cobre') {
                                    correctedItem = 'Cobre';
                                } else if (correctedItem.toLowerCase() === 'hierro') {
                                    correctedItem = 'Hierro';
                                } else if (correctedItem.toLowerCase() === 'plata') {
                                    correctedItem = 'Plata';
                                } else if (correctedItem.toLowerCase() === 'oro') {
                                    correctedItem = 'Oro';
                                } else if (correctedItem.toLowerCase() === 'madera') {
                                    correctedItem = 'Madera';
                                }

                                // Actualizar el inventario con la corrección
                                inventory[item] = correctedItem;
                            }

                            // Actualizar el inventario en Firebase
                            set(ref(db, 'users/' + username + '/inventory'), inventory);
                        }
                    }

                    alert('Inventarios corregidos exitosamente!');
                } else {
                    console.log("No se encontraron datos de usuarios.");
                }
            }).catch((error) => {
                console.error("Error al obtener los usuarios: ", error);
            });
        }
    </script>
</head>
<body>
    <h1>Corregir Inventarios de Todos los Usuarios</h1>
    <button onclick="corregirInventarios()">Corregir Inventarios</button>
</body>
</html>
