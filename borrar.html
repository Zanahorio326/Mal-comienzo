<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Configuración para dispositivos móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Libro Digital para Móvil</title>
  <!-- Librerías externas -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4/turn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <style>
    /* Ocupa toda la pantalla */
    html, body {
      margin: 0;
      padding: 0;
      background: #222;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    /* Contenedor del flipbook, adaptable a pantalla completa */
    #flipbook-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    /* Contenedor de Turn.js */
    #flipbook {
      width: 100%;
      height: 100%;
    }
    /* Estilos para cada página */
    .page {
      background: #fff;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      padding: 10px;
      font-size: 24px;
      color: #333;
    }
    /* Estilo para portada y contraportada */
    .cover {
      background: #333;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
    }
    /* Áreas superpuestas para detectar pulsaciones */
    .nav-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 100;
    }
    #nav-left {
      left: 0;
    }
    #nav-right {
      right: 0;
    }
  </style>
</head>
<body>
  <div id="flipbook-container">
    <!-- Contenedor de páginas -->
    <div id="flipbook">
      <!-- Página 1: Portada -->
      <div class="page cover animate__animated animate__fadeIn">
        Portada del Libro
      </div>
      <!-- Página 2: Introducción -->
      <div class="page animate__animated animate__fadeIn">
        <div>
          <h2>Capítulo 1: Introducción</h2>
          <p>Contenido de la introducción...</p>
        </div>
      </div>
      <!-- Página 3: Desarrollo -->
      <div class="page animate__animated animate__fadeIn">
        <div>
          <h2>Capítulo 2: Desarrollo</h2>
          <p>Contenido del desarrollo...</p>
        </div>
      </div>
      <!-- Página 4: Conclusión -->
      <div class="page animate__animated animate__fadeIn">
        <div>
          <h2>Capítulo 3: Conclusión</h2>
          <p>Contenido de la conclusión...</p>
        </div>
      </div>
      <!-- Página 5: Contraportada -->
      <div class="page cover animate__animated animate__fadeIn">
        Contraportada
      </div>
      <!-- Página Dummy para completar el par -->
      <div class="page animate__animated animate__fadeIn"></div>
    </div>
    <!-- Áreas para detectar pulsaciones -->
    <div id="nav-left" class="nav-overlay"></div>
    <div id="nav-right" class="nav-overlay"></div>
  </div>

  <script>
    $(document).ready(function(){
      // Inicializa Turn.js adaptando el tamaño al contenedor
      $("#flipbook").turn({
        width: $("#flipbook-container").width(),
        height: $("#flipbook-container").height(),
        autoCenter: true,
        duration: 600,
        display: 'single'  // Muestra una página a la vez
      });
      
      // Ajusta el tamaño del flipbook al redimensionar la ventana
      $(window).resize(function(){
        var newWidth = $("#flipbook-container").width();
        var newHeight = $("#flipbook-container").height();
        $("#flipbook").turn("size", newWidth, newHeight);
      });
      
      // Configura Hammer.js para detectar gestos en el contenedor completo
      var container = document.getElementById("flipbook-container");
      var hammer = new Hammer(container);
      hammer.on("swipeleft", function() {
        $("#flipbook").turn("next");
      });
      hammer.on("swiperight", function() {
        $("#flipbook").turn("previous");
      });
      
      // Detecta pulsaciones en las áreas laterales para cambiar de página
      $("#nav-left").click(function(){
        $("#flipbook").turn("previous");
      });
      $("#nav-right").click(function(){
        $("#flipbook").turn("next");
      });
    });
  </script>
</body>
</html>
