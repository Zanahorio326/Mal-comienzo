<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecciones</title>
  <style>
    /* Estilos para la alerta personalizada */
    #customAlert {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8); /* Aumenta la opacidad a 0.8 */
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #alertBox {
      background: #fff;
      padding: 20px;
      border-radius: 5px;
      text-align: center;
      max-width: 300px;
      width: 90%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    #alertBox h2 {
      margin-top: 0;
    }
    #alertButtons button {
      margin: 5px;
    }
  </style>
  <script type="module">
    document.addEventListener("DOMContentLoaded", function() {
      // Botón "🏆Poder🎖️" redirige inmediatamente a la página
      document.getElementById("btnPoder").addEventListener("click", function() {
        window.top.location.href = "https://zanahorio326.github.io/Mal-comienzo/prestigio.html";
      });

      // Botón "Misión 👑" muestra la alerta personalizada en la página principal
      document.getElementById("btnMision").addEventListener("click", function() {
        let topDocument = window.top.document;

        // Si la alerta aún no existe en la página principal, la creamos
        if (!topDocument.getElementById("customAlert")) {
          let customAlert = topDocument.createElement("div");
          customAlert.id = "customAlert";
          customAlert.innerHTML = `
            <div id="alertBox">
              <h2>⚔️ Misión Real 👑</h2>
              <p>📜 El rey solicita tu ayuda para proteger el pueblo de Codderland 🏰</p><br>
              <p>Aún no tienes experiencia en combate como para portar tus armas ⚔️ (en caso de que las tengas) y eso hace desconfiar al rey, empieza con misiones simples ✊ a puño limpio, te enviaremos a eliminar a un par de lobos 🐺 que amenazan al ganado.</p>
              <div id="alertButtons">
                <button id="btnCancelar">°n° No soy digno</button>
                <button id="btnAceptar">Yo me encargo (ง'̀-'́)ง</button>
              </div>
            </div>
          `;
          customAlert.style.position = "fixed";
          customAlert.style.top = "0";
          customAlert.style.left = "0";
          customAlert.style.width = "100%";
          customAlert.style.height = "100%";
          customAlert.style.background = "rgba(0,0,0,0.8)"; /* Fondo más oscuro */
          customAlert.style.display = "flex";
          customAlert.style.justifyContent = "center";
          customAlert.style.alignItems = "center";
          customAlert.style.zIndex = "9999";
          
          topDocument.body.appendChild(customAlert);

          // Asignar eventos a los botones en la página principal
          topDocument.getElementById("btnCancelar").addEventListener("click", function() {
            topDocument.body.removeChild(customAlert);
          });

          topDocument.getElementById("btnAceptar").addEventListener("click", function() {
            window.top.location.href = "https://zanahorio326.github.io/Mal-comienzo/Pelea.html";
          });
        } else {
          // Si la alerta ya existe, solo la mostramos
          topDocument.getElementById("customAlert").style.display = "flex";
        }
      });
    });
  </script>
</head>
<body>
  <!-- Botón que redirige inmediatamente -->
  <button id="btnPoder">🏆Poder🎖️</button>
  <br><br>
  <!-- Botón que muestra la alerta personalizada -->
  <button id="btnMision">Misión 👑</button>
</body>
</html>
