<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecciones</title>
  <style>
    /* Estilos para el recuadro flotante */
    #modalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #modalBox {
      background: #fff;
      padding: 20px;
      border-radius: 5px;
      text-align: center;
      max-width: 300px;
      width: 90%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    #modalBox h2 {
      margin-top: 0;
    }
    #modalButtons button {
      margin: 5px;
    }
  </style>
  <script type="module">
    document.addEventListener("DOMContentLoaded", function() {
      // Botón "🏆Poder🎖️" redirige inmediatamente a la página
      document.getElementById("btnPoder").addEventListener("click", function() {
        window.top.location.href = "https://zanahorio326.github.io/Mal-comienzo/prestigio.html";
      });

      // Botón "Misión 👑" muestra el recuadro de confirmación
      document.getElementById("btnMision").addEventListener("click", function() {
        // Forzar que el modal se muestre en la pantalla principal (fuera del iframe)
        const modalOverlay = document.createElement("div");
        modalOverlay.id = "modalOverlay";
        modalOverlay.innerHTML = `
          <div id="modalBox">
            <h2>⚔️ Misión Real 👑</h2>
            <p>📜 El rey solicita tu ayuda para proteger el pueblo de Codderland 🏰</p>
            <p>Aún no tienes experiencia en combate como para portar tus armas ⚔️ (en caso de que las tengas) y eso hace desconfiar al rey, empieza con misiónes simples ✊ a puño limpio, te enviaremos a eliminar a un par de lobos 🐺 amenazan al ganado.</p>
            <div id="modalButtons">
              <button id="btnCancelar">°n° No soy digno</button>
              <button id="btnAceptar">Yo me encargo (ง'̀-'́)ง</button>
            </div>
          </div>
        `;
        // Agregar el modal a la pantalla principal
        document.body.appendChild(modalOverlay);

        // Función de cierre del modal
        document.getElementById("btnCancelar").addEventListener("click", function() {
          document.body.removeChild(modalOverlay);
        });

        // Botón "aceptar" redirige a la página indicada
        document.getElementById("btnAceptar").addEventListener("click", function() {
          window.top.location.href = "https://zanahorio326.github.io/Mal-comienzo/Pelea.html";
        });
      });
    });
  </script>
</head>
<body>
  <!-- Botón que redirige inmediatamente -->
  <button id="btnPoder">🏆Poder🎖️</button>
  <br><br>
  <!-- Botón que muestra el recuadro de confirmación -->
  <button id="btnMision">Misión 👑</button>
</body>
</html>
