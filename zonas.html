<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecciones</title>
  <style>
    /* Estilos para el recuadro flotante */
    #modalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #modalBox {
      background: #fff;
      padding: 20px;
      border-radius: 5px;
      text-align: center;
      max-width: 300px;
      width: 90%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    #modalBox h2 {
      margin-top: 0;
    }
    #modalButtons button {
      margin: 5px;
    }
  </style>
  <script type="module">
    document.addEventListener("DOMContentLoaded", function() {
      // Botón "🏆Poder🎖️" redirige inmediatamente a la página
      document.getElementById("btnPoder").addEventListener("click", function() {
        window.top.location.href = "https://zanahorio326.github.io/Mal-comienzo/prestigio.html";
      });

      // Botón "Misión 👑" muestra la confirmación
      document.getElementById("btnMision").addEventListener("click", function() {
        // Mostrar cuadro de confirmación
        const userConfirmed = confirm("⚔️ Misión Real 👑\n\n📜 El rey solicita tu ayuda para proteger el pueblo de Codderland 🏰\nAún no tienes experiencia en combate como para portar tus armas ⚔️ (en caso de que las tengas) y eso hace desconfiar al rey, empieza con misiónes simples ✊ a puño limpio, te enviaremos a eliminar a un par de lobos 🐺 amenazan al ganado.");
        
        if (userConfirmed) {
          // Si el usuario acepta, redirigir a la página de misión
          window.location.href = "https://zanahorio326.github.io/Mal-comienzo/Pelea.html";
        }
        // Si el usuario cancela, no hacer nada
      });
    });
  </script>
</head>
<body>
  <!-- Botón que redirige inmediatamente -->
  <button id="btnPoder">🏆Poder🎖️</button>
  <br><br>
  <!-- Botón que muestra el recuadro de confirmación -->
  <button id="btnMision">Misión 👑</button>
</body>
</html>
