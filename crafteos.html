<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crafteos</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, get, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
      authDomain: "thegame-5afaa.firebaseapp.com",
      databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
      projectId: "thegame-5afaa",
      storageBucket: "thegame-5afaa.firebasestorage.app",
      messagingSenderId: "588556182984",
      appId: "1:588556182984:web:a0557067d35c18e3944cfd",
      measurementId: "G-9M3CBJ3LV9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Obtención del nombre de usuario y referencia en la base de datos
    const username = localStorage.getItem("username") || "Desconocido";
    const userRef = ref(db, 'users/' + username);

    document.addEventListener("DOMContentLoaded", function() {

      // Variables de botones (verificando existencia)
      const btnCuchillo = document.getElementById("btn1");
      const btnespada = document.getElementById("btnespada");
      const btnMinar = document.getElementById("btnMinar");
      const btnTalar = document.getElementById("btnTalar");
      const btnPoder = document.getElementById("btnPoder");
      const btnmoneda = document.getElementById("btnmoneda");

      // Función para reactivar botones
      function reactivarBotones() {
        btnCuchillo.disabled = false;
        if (btnespada) btnespada.disabled = false;
        if (btnMinar) btnMinar.disabled = false;
        if (btnTalar) btnTalar.disabled = false;
        if (btnPoder) btnPoder.disabled = false;
        if (btnmoneda) btnmoneda.disabled = false;
      }

      // Evento para craftear el cuchillo
      btnCuchillo.addEventListener("click", function() {
        // Deshabilitar todos los botones relacionados (si existen)
        btnCuchillo.disabled = true;
        if(btnespada) btnespada.disabled = true;
        if(btnMinar) btnMinar.disabled = true;
        if(btnTalar) btnTalar.disabled = true;
        if(btnPoder) btnPoder.disabled = true;
        if(btnmoneda) btnmoneda.disabled = true;

        // Mensaje inicial al comenzar el crafteo del cuchillo
        push(ref(db, 'chat'), {
          usuario: username,
          texto: "Para hacer un cuchillo 🔪 necesito 3 de carbón 🪨 para fundir el metal, 2 de hierro ⚙️ para la hoja y 1 de madera 🪵 para tallar el mango ó_ò",
          timestamp: Date.now()
        });

        setTimeout(function() {
          // Verificación de recursos (Momento 2)
          get(userRef)
            .then((snapshot) => {
              if (snapshot.exists()) {
                const inventory = snapshot.val().inventory || {
                  carbón: 0,
                  cobre: 0,
                  hierro: 0,
                  plata: 0,
                  oro: 0,
                  madera: 0
                };

                if (inventory.carbón >= 3 && inventory.hierro >= 2 && inventory.madera >= 1) {
                  // Si tiene los recursos necesarios
                  push(ref(db, 'chat'), {
                    usuario: username,
                    texto: "^_^ Tengo esos materiales, encenderé la forja... 🔥",
                    timestamp: Date.now()
                  });

                  setTimeout(function() {
                    // Confirmación de crafteo (Momento 3)
                    push(ref(db, 'chat'), {
                      usuario: username,
                      texto: " `~` 🪨 Usaré el carbón para derretir el metal...",
                      timestamp: Date.now()
                    });

                    // Descontar los materiales necesarios
                    inventory.carbón -= 3;
                    inventory.hierro -= 2;
                    inventory.madera -= 1;

                    update(userRef, { inventory });

                    setTimeout(function() {
                      // Descuento de materiales (Momento 4)
                      push(ref(db, 'chat'), {
                        usuario: username,
                        texto: "(/◕ヮ◕)/ 🪵 Aré el mango con la madera...",
                        timestamp: Date.now()
                      });

                      setTimeout(function() {
                        // Proceso de crafteo (Momentos 5 y 6)
                        setTimeout(function() {
                          // Crafteo finalizado (Momento 6)
                          push(ref(db, 'chat'), {
                            usuario: username,
                            texto: "¡Listo! 🔪ヽ(^o^)丿",
                            timestamp: Date.now()
                          });

                          // Añadir cuchillo al inventario
                          inventory.cuchillo = (inventory.cuchillo || 0) + 1;
                          update(userRef, { inventory });

                          // Habilitar nuevamente todos los botones
                          reactivarBotones();
                        }, 10000);
                      }, 10000);
                    }, 10000);
                  }, 10000);
                } else {
                  // No tiene los recursos necesarios
                  push(ref(db, 'chat'), {
                    usuario: username,
                    texto: "🎒 Creo que mi mochila está algo vacía como para eso",
                    timestamp: Date.now()
                  });
                  setTimeout(function() {
                    reactivarBotones();
                  }, 1000);
                }
              } else {
                // No se encontró inventario
                push(ref(db, 'chat'), {
                  usuario: username,
                  texto: "No se encontró inventario para este usuario.",
                  timestamp: Date.now()
                });
                setTimeout(function() {
                  reactivarBotones();
                }, 1000);
              }
            })
            .catch((error) => {
              console.error("Error al obtener los recursos: ", error);
              reactivarBotones();
            });
        }, 1000);
      });

      // Evento para craftear la espada
      btnespada.addEventListener("click", function() {
        // Deshabilitar todos los botones relacionados (si existen)
        btnespada.disabled = true;
        if(btnCuchillo) btnCuchillo.disabled = true;
        if(btnMinar) btnMinar.disabled = true;
        if(btnTalar) btnTalar.disabled = true;
        if(btnPoder) btnPoder.disabled = true;
        if(btnmoneda) btnmoneda.disabled = true;

        // Mensaje inicial al comenzar el crafteo de la espada
        push(ref(db, 'chat'), {
          usuario: username,
          texto: "Para hacer una espada 🗡️ necesito 3 de hierro ⚙️, 1 de madera 🪵, y 5 de carbón 🪨.",
          timestamp: Date.now()
        });

        setTimeout(function() {
          // Verificación de recursos (Momento 2)
          get(userRef)
            .then((snapshot) => {
              if (snapshot.exists()) {
                const inventory = snapshot.val().inventory || {
                  carbón: 0,
                  cobre: 0,
                  hierro: 0,
                  plata: 0,
                  oro: 0,
                  madera: 0
                };

                if (inventory.carbón >= 5 && inventory.hierro >= 3 && inventory.madera >= 1) {
                  // Si tiene los recursos necesarios
                  push(ref(db, 'chat'), {
                    usuario: username,
                    texto: "^_^ Tengo esos materiales, encenderé la forja... 🔥",
                    timestamp: Date.now()
                  });

                  setTimeout(function() {
                    // Confirmación de crafteo (Momento 3)
                    push(ref(db, 'chat'), {
                      usuario: username,
                      texto: " `~` 🪨 Usaré el carbón para derretir el metal...",
                      timestamp: Date.now()
                    });

                    // Descontar los materiales necesarios
                    inventory.carbón -= 5;
                    inventory.hierro -= 3;
                    inventory.madera -= 1;

                    update(userRef, { inventory });

                    setTimeout(function() {
                      // Descuento de materiales (Momento 4)
                      push(ref(db, 'chat'), {
                        usuario: username,
                        texto: "(/◕ヮ◕)/ 🪵 Aré el mango con la madera...",
                        timestamp: Date.now()
                      });

                      setTimeout(function() {
                        // Proceso de crafteo (Momentos 5 y 6)
                        setTimeout(function() {
                          // Crafteo finalizado (Momento 6)
                          push(ref(db, 'chat'), {
                            usuario: username,
                            texto: "¡Listo! 🗡️ヽ(^o^)丿",
                            timestamp: Date.now()
                          });

                          // Añadir espada al inventario
                          inventory.espada = (inventory.espada || 0) + 1;
                          update(userRef, { inventory });

                          // Habilitar nuevamente todos los botones
                          reactivarBotones();
                        }, 15000); // Tiempo de crafteo de la espada aumentado
                      }, 10000);
                    }, 10000);
                  }, 10000);
                } else {
                  // No tiene los recursos necesarios
                  push(ref(db, 'chat'), {
                    usuario: username,
                    texto: "debería trabajar más ⛏️ aún no tengo esos materiales",
                    timestamp: Date.now()
                  });
                  setTimeout(function() {
                    reactivarBotones();
                  }, 1000);
                }
              } else {
                // No se encontró inventario
                push(ref(db, 'chat'), {
                  usuario: username,
                  texto: "No se encontró inventario para este usuario.",
                  timestamp: Date.now()
                });
                setTimeout(function() {
                  reactivarBotones();
                }, 1000);
              }
            })
            .catch((error) => {
              console.error("Error al obtener los recursos: ", error);
              reactivarBotones();
            });
        }, 1000);
      });

      // Evento para craftear moneda
      btnmoneda.addEventListener("click", function() {
        // Deshabilitar todos los botones relacionados (si existen)
        btnmoneda.disabled = true;
        btnCuchillo.disabled = true;
        if(btnespada) btnespada.disabled = true;
        if(btnMinar) btnMinar.disabled = true;
        if(btnTalar) btnTalar.disabled = true;
        if(btnPoder) btnPoder.disabled = true;

        // Mensaje inicial al comenzar el crafteo de la moneda
        push(ref(db, 'chat'), {
          usuario: username,
          texto: "mensaje 1",
          timestamp: Date.now()
        });

        setTimeout(function() {
          // Verificación de recursos
          get(userRef)
            .then((snapshot) => {
              if (snapshot.exists()) {
                const inventory = snapshot.val().inventory || {
                  carbón: 0,
                  cobre: 0,
                  hierro: 0,
                  plata: 0,
                  oro: 0,
                  madera: 0
                };

                if (inventory.cobre >= 2 && inventory.oro >= 1 && inventory.plata >= 1 && inventory.carbón >= 4) {
                  // Tiene los recursos necesarios
                  push(ref(db, 'chat'), {
                    usuario: username,
                    texto: "mensaje 3",
                    timestamp: Date.now()
                  });

                  // Descontar los materiales necesarios
                  inventory.cobre -= 2;
                  inventory.oro -= 1;
                  inventory.plata -= 1;
                  inventory.carbón -= 4;
                  update(userRef, { inventory });

                  setTimeout(function() {
                    // Crafteo finalizado
                    push(ref(db, 'chat'), {
                      usuario: username,
                      texto: "mensaje 4",
                      timestamp: Date.now()
                    });

                    // Añadir moneda al inventario
                    inventory.moneda = (inventory.moneda || 0) + 1;
                    update(userRef, { inventory });

                    // Reactivar botones
                    reactivarBotones();
                  }, 15000);
                } else {
                  // No tiene los recursos necesarios
                  push(ref(db, 'chat'), {
                    usuario: username,
                    texto: "mensaje 2",
                    timestamp: Date.now()
                  });
                  setTimeout(function() {
                    reactivarBotones();
                  }, 1000);
                }
              } else {
                // No se encontró inventario
                push(ref(db, 'chat'), {
                  usuario: username,
                  texto: "No se encontró inventario para este usuario.",
                  timestamp: Date.now()
                });
                setTimeout(function() {
                  reactivarBotones();
                }, 1000);
              }
            })
            .catch((error) => {
              console.error("Error al obtener los recursos: ", error);
              reactivarBotones();
            });
        }, 3000);
      });

    });
  </script>
</head>
<body>
  <!-- Botón para craftear cuchillo -->
  <button id="btn1">🔪 cuchillo</button>
  <br><br>
  <!-- Botón para craftear espada -->
  <button id="btnespada">🗡️ espada</button>
  <br><br>
  <!-- Botón para craftear moneda -->
  <button id="btnmoneda">🪙 moneda</button>
</body>
</html>
