<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crafteos</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, get, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    // Configuración de Firebase (igual que en el código original)
    const firebaseConfig = {
      apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
      authDomain: "thegame-5afaa.firebaseapp.com",
      databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
      projectId: "thegame-5afaa",
      storageBucket: "thegame-5afaa.firebasestorage.app",
      messagingSenderId: "588556182984",
      appId: "1:588556182984:web:a0557067d35c18e3944cfd",
      measurementId: "G-9M3CBJ3LV9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Obtención del nombre de usuario y referencia en la base de datos
    const username = localStorage.getItem("username") || "Desconocido";
    const userRef = ref(db, 'users/' + username);

    document.addEventListener("DOMContentLoaded", function() {

      // Evento para craftear el cuchillo (botón con id "btn1")
      document.getElementById("btn1").addEventListener("click", function() {
        // Deshabilitar todos los botones relacionados
        document.getElementById("btn1").disabled = true;
        document.getElementById("btn2").disabled = true;
        document.getElementById("btnMinar") && (document.getElementById("btnMinar").disabled = true);
        document.getElementById("btnTalar") && (document.getElementById("btnTalar").disabled = true);
        document.getElementById("btnPoder") && (document.getElementById("btnPoder").disabled = true);

        // Mensaje inicial al comenzar el crafteo del cuchillo
        push(ref(db, 'chat'), {
          usuario: username,
          texto: "Para hacer un cuchillo 🔪 necesito 3 de carbón 🪨 para fundir el metal, 2 de hierro ⚙️ para la hoja y 1 de madera 🪵 para tallar el mango ó_ò",
          timestamp: Date.now()
        });

        setTimeout(function() {
          // Verificación de recursos (Momento 2)
          get(userRef).then((snapshot) => {
            if (snapshot.exists()) {
              const inventory = snapshot.val().inventory || {
                carbón: 0,
                cobre: 0,
                hierro: 0,
                plata: 0,
                oro: 0,
                madera: 0
              };

              if (inventory.carbón >= 3 && inventory.hierro >= 2 && inventory.madera >= 1) {
                // Si tiene los recursos necesarios
                push(ref(db, 'chat'), {
                  usuario: username,
                  texto: "^_^ Tengo esos materiales, encenderé la forja... 🔥",
                  timestamp: Date.now()
                });

                setTimeout(function() {
                  // Confirmación de crafteo (Momento 3)
                  push(ref(db, 'chat'), {
                    usuario: username,
                    texto: " `~` 🪨 Usaré el carbón para derretir el metal...",
                    timestamp: Date.now()
                  });

                  // Descontar los materiales necesarios
                  inventory.carbón -= 3;
                  inventory.hierro -= 2;
                  inventory.madera -= 1;

                  update(userRef, { inventory });

                  setTimeout(function() {
                    // Descuento de materiales (Momento 4)
                    push(ref(db, 'chat'), {
                      usuario: username,
                      texto: "(/◕ヮ◕)/ 🪵 Aré el mango con la madera...",
                      timestamp: Date.now()
                    });

                    setTimeout(function() {
                      // Proceso de crafteo (Momentos 5 y 6)
                      setTimeout(function() {
                        // Crafteo finalizado (Momento 6)
                        push(ref(db, 'chat'), {
                          usuario: username,
                          texto: "¡Listo! 🔪ヽ(^o^)丿",
                          timestamp: Date.now()
                        });

                        // Añadir cuchillo al inventario
                        inventory.cuchillo = (inventory.cuchillo || 0) + 1;
                        update(userRef, { inventory });

                        // Habilitar nuevamente todos los botones
                        document.getElementById("btn1").disabled = false;
                        document.getElementById("btn2").disabled = false;
                        document.getElementById("btnMinar") && (document.getElementById("btnMinar").disabled = false);
                        document.getElementById("btnTalar") && (document.getElementById("btnTalar").disabled = false);
                        document.getElementById("btnPoder") && (document.getElementById("btnPoder").disabled = false);
                      }, 10000);
                    }, 10000);
                  }, 10000);
                }, 10000);
              } else {
                // Si no tiene los recursos necesarios
                push(ref(db, 'chat'), {
                  usuario: username,
                  texto: "mensaje 3",
                  timestamp: Date.now()
                });

                setTimeout(function() {
                  // Habilitar nuevamente los botones
                  document.getElementById("btn1").disabled = false;
                  document.getElementById("btn2").disabled = false;
                  document.getElementById("btnMinar") && (document.getElementById("btnMinar").disabled = false);
                  document.getElementById("btnTalar") && (document.getElementById("btnTalar").disabled = false);
                  document.getElementById("btnPoder") && (document.getElementById("btnPoder").disabled = false);
                }, 1000);
              }
            }
          }).catch((error) => console.error("Error al obtener los recursos: ", error));
        }, 1000);
      });

      // Nota: Se incluye la referencia a "btn2" para que la deshabilitación tenga efecto,
      // aunque en este ejemplo solo se ha implementado el crafteo del cuchillo.
    });
  </script>
</head>
<body>
  <!-- Encabezado de la sección de Crafteos -->
  <div style="border: 1px solid; padding: 5px; width: 70px; text-align: center; color: white; background-color: gray; font-size: 12px;">
    Crafteos
  </div>
  <br>
  <!-- Botón para craftear cuchillo -->
  <button id="btn1">🔪 cuchillo</button>
  <br><br>
  <!-- Botón para craftear espada (sin funcionalidad implementada en este ejemplo) -->
  <button id="btnEspada">🗡️ Espada</button>
</body>
</html>
