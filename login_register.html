<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Registro</title>
    <style>
        /* Estilos de la tarjeta */
        .login-card {
            width: 300px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
        }
        .btn-group button {
            width: 48%;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .input-group {
            margin-top: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .input-group button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .input-group button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Botones de Registro e Inicio de sesión -->
        <div class="btn-group">
            <button id="btn-register" onclick="showRegister()">Registrarse</button>
            <button id="btn-login" onclick="showLogin()">Iniciar sesión</button>
        </div>

        <!-- Formulario de Registro -->
        <div id="register-form" style="display:none;">
            <div class="input-group">
                <input type="text" id="username-register" placeholder="Nombre de usuario" required>
                <input type="password" id="password-register" placeholder="Contraseña" required>
                <button onclick="registerUser()">Registrar</button>
            </div>
        </div>

        <!-- Formulario de Login -->
        <div id="login-form" style="display:block;">
            <div class="input-group">
                <input type="text" id="username-login" placeholder="Nombre de usuario" required>
                <input type="password" id="password-login" placeholder="Contraseña" required>
                <button onclick="loginUser()">Iniciar sesión</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
    
    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Mostrar formulario de Registro
        function showRegister() {
            document.getElementById('register-form').style.display = 'block';
            document.getElementById('login-form').style.display = 'none';
        }

        // Mostrar formulario de Login
        function showLogin() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
        }

        // Verificación si el nombre de usuario ya está registrado
        const checkIfUserExists = async (username) => {
            const snapshot = await database.ref('users').orderByChild('username').equalTo(username).once('value');
            return snapshot.exists();
        };

        // Función de Registro de Usuario
        const registerUser = async () => {
            const username = document.getElementById('username-register').value;
            const password = document.getElementById('password-register').value;

            // Verificamos si el nombre de usuario ya está registrado
            const userExists = await checkIfUserExists(username);

            if (userExists) {
                alert('El nombre de usuario ya está registrado. Elige otro.');
                return;  // No proceder con el registro si ya existe el nombre de usuario.
            }

            // Registramos el nuevo usuario
            database.ref('users').push({
                username: username,
                password: password
            }).then(() => {
                alert('Registro exitoso. ¡Bienvenido!');
                window.location.href = "chat.html"; // Redirigimos al chat después de registrarse
            }).catch((error) => {
                alert('Error en el registro: ' + error.message);
            });
        };

        // Función de Login de Usuario
        const loginUser = async () => {
            const username = document.getElementById('username-login').value;
            const password = document.getElementById('password-login').value;

            const snapshot = await database.ref('users').orderByChild('username').equalTo(username).once('value');

            if (!snapshot.exists()) {
                alert('El nombre de usuario no existe. Por favor, regístrate primero.');
                return;
            }

            // Verificamos si la contraseña es correcta
            const userData = Object.values(snapshot.val())[0];
            if (userData.password === password) {
                alert('Inicio de sesión exitoso.');
                window.location.href = "chat.html"; // Redirigimos al chat después de iniciar sesión
            } else {
                alert('Contraseña incorrecta.');
            }
        };
    </script>
</body>
</html>
