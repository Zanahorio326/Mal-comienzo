<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    .container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }
    .button-group {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .button-group button {
      flex: 1;
      margin: 0 5px;
      padding: 10px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .button-group button:hover {
      background-color: #0056b3;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .chat-btn {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .chat-btn:hover {
      background-color: #218838;
    }
    .error {
      color: red;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="button-group">
      <button onclick="setMode('register')" id="registerBtn">Registrarse</button>
      <button onclick="setMode('login')" id="loginBtn">Iniciar sesión</button>
    </div>

    <input type="text" id="username" placeholder="Nombre de usuario" required>
    <input type="password" id="password" placeholder="Contraseña" required>

    <button class="chat-btn" onclick="handleChat()">Chat</button>
    <p class="error" id="errorText"></p>
  </div>

  <script>
    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
      authDomain: "thegame-5afaa.firebaseapp.com",
      databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
      projectId: "thegame-5afaa",
      storageBucket: "thegame-5afaa.firebasestorage.app",
      messagingSenderId: "588556182984",
      appId: "1:588556182984:web:a0557067d35c18e3944cfd",
      measurementId: "G-9M3CBJ3LV9"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let mode = "register"; // Modo inicial

    function setMode(newMode) {
      mode = newMode;
      console.log("Modo cambiado a:", mode);
    }

    function handleChat() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorText = document.getElementById('errorText');

      if (username === "" || password === "") {
        errorText.textContent = "Por favor, completa ambos campos.";
        return;
      }

      if (mode === "register") {
        registerUser(username, password);
      } else {
        loginUser(username, password);
      }
    }

    function registerUser(username, password) {
      const userRef = database.ref("users/" + username);

      userRef.once("value", snapshot => {
        if (snapshot.exists()) {
          document.getElementById("errorText").textContent = "Este usuario ya existe.";
        } else {
          userRef.set({ password })
            .then(() => {
              console.log("Usuario registrado:", username);
              window.location.href = "https://zanahorio326.github.io/Mal-comienzo/chat.html";
            })
            .catch(error => {
              console.error("Error al registrar:", error);
              document.getElementById("errorText").textContent = "Error en el registro.";
            });
        }
      });
    }

    function loginUser(username, password) {
      const userRef = database.ref("users/" + username);

      userRef.once("value", snapshot => {
        if (snapshot.exists()) {
          const storedPassword = snapshot.val().password;
          if (storedPassword === password) {
            console.log("Inicio de sesión exitoso:", username);
            window.location.href = "https://zanahorio326.github.io/Mal-comienzo/chat.html";
          } else {
            document.getElementById("errorText").textContent = "Contraseña incorrecta.";
          }
        } else {
          document.getElementById("errorText").textContent = "El usuario no existe.";
        }
      });
    }
  </script>

</body>
</html>
