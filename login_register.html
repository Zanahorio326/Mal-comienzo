<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script type="module">
        // Importar Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        alert("Firebase cargado correctamente"); // Verificar carga de Firebase

        // Función de Registro
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("btnRegistro").addEventListener("click", function() {
                alert("Botón de registro presionado"); // Verificar clic

                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                if (username === "" || password === "") {
                    alert("Por favor, completa todos los campos.");
                    return;
                }

                const userRef = ref(db, 'users/' + username);
                get(child(ref(db), 'users/' + username)).then((snapshot) => {
                    if (snapshot.exists()) {
                        alert("El nombre de usuario ya está registrado.");
                    } else {
                        set(userRef, {
                            username: username,
                            password: password
                        }).then(() => {
                            alert("Registro exitoso, redirigiendo al chat...");
                            window.location.href = "chat.html";
                        }).catch((error) => {
                            alert("Error al registrar: " + error.message);
                        });
                    }
                }).catch((error) => {
                    alert("Error al verificar usuario: " + error.message);
                });
            });

            // Función de Inicio de Sesión
            document.getElementById("btnLogin").addEventListener("click", function() {
                alert("Botón de inicio de sesión presionado"); // Verificar clic

                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                if (username === "" || password === "") {
                    alert("Por favor, completa todos los campos.");
                    return;
                }

                const userRef = ref(db, 'users/' + username);
                get(child(ref(db), 'users/' + username)).then((snapshot) => {
                    if (snapshot.exists() && snapshot.val().password === password) {
                        alert("Inicio de sesión exitoso, redirigiendo al chat...");
                        window.location.href = "chat.html";
                    } else {
                        alert("Nombre de usuario o contraseña incorrectos.");
                    }
                }).catch((error) => {
                    alert("Error al verificar credenciales: " + error.message);
                });
            });
        });
    </script>
</head>
<body>
    <div style="width: 300px; margin: auto; padding: 20px; border: 1px solid #ccc; text-align: center;">
        <button id="btnRegistro">Registrarse</button>
        <button id="btnLogin">Iniciar Sesión</button>
        <br><br>
        <input type="text" id="username" placeholder="Nombre de usuario">
        <br><br>
        <input type="password" id="password" placeholder="Contraseña">
        <br><br>
        <button id="btnChat">Chat</button>
    </div>
</body>
</html>
