<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login y Registro</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "tu_apiKey",
      authDomain: "tu_authDomain",
      projectId: "tu_projectId",
      storageBucket: "tu_storageBucket",
      messagingSenderId: "tu_messagingSenderId",
      appId: "tu_appId"
    };

    // Inicialización de Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
  </script>
</head>
<body>
  <h1>Bienvenido</h1>

  <!-- Botones de inicio de sesión y registro -->
  <div>
    <button id="loginBtn">Iniciar sesión</button>
    <button id="registerBtn">Registrarse</button>
  </div>

  <!-- Contenedor de formularios -->
  <div id="formContainer" style="display: none;">
    <!-- Formulario de Inicio de sesión -->
    <div id="loginForm" style="display: none;">
      <h2>Iniciar sesión</h2>
      <table>
        <tr>
          <td><label for="loginEmail">Correo Electrónico</label></td>
          <td><input type="email" id="loginEmail" placeholder="Correo Electrónico" required></td>
        </tr>
        <tr>
          <td><label for="loginPassword">Contraseña</label></td>
          <td><input type="password" id="loginPassword" placeholder="Contraseña" required></td>
        </tr>
      </table>
      <button id="loginSubmit">Iniciar sesión</button>
      <p id="loginError" style="color: red;"></p> <!-- Mensaje de error -->
    </div>

    <!-- Formulario de Registro -->
    <div id="registerForm" style="display: none;">
      <h2>Registrarse</h2>
      <table>
        <tr>
          <td><label for="username">Nombre de usuario</label></td>
          <td><input type="text" id="username" placeholder="Nombre de usuario" required></td>
        </tr>
        <tr>
          <td><label for="registerEmail">Correo Electrónico</label></td>
          <td><input type="email" id="registerEmail" placeholder="Correo Electrónico" required></td>
        </tr>
        <tr>
          <td><label for="registerPassword">Contraseña</label></td>
          <td><input type="password" id="registerPassword" placeholder="Contraseña" required></td>
        </tr>
      </table>
      <button id="registerSubmit">Registrarse</button>
      <p id="registerError" style="color: red;"></p> <!-- Mensaje de error -->
    </div>
  </div>

  <script>
    // Variables de los botones
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formContainer = document.getElementById('formContainer');
    const loginError = document.getElementById('loginError');
    const registerError = document.getElementById('registerError');

    // Mostrar formulario de inicio de sesión cuando se hace clic en "Iniciar sesión"
    loginBtn.addEventListener('click', () => {
      formContainer.style.display = 'block';
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
    });

    // Mostrar formulario de registro cuando se hace clic en "Registrarse"
    registerBtn.addEventListener('click', () => {
      formContainer.style.display = 'block';
      registerForm.style.display = 'block';
      loginForm.style.display = 'none';
    });

    // Acción al presionar el botón de "Iniciar sesión"
    document.getElementById('loginSubmit').addEventListener('click', () => {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          // Redirigir al chat en caso de éxito
          window.location.href = "https://zanahorio326.github.io/Mal-comienzo/chat.html";
        })
        .catch((error) => {
          // Mostrar mensaje de error
          loginError.textContent = "Error al iniciar sesión: " + error.message;
        });
    });

    // Acción al presionar el botón de "Registrarse"
    document.getElementById('registerSubmit').addEventListener('click', () => {
      const username = document.getElementById('username').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;

      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          // Redirigir al chat en caso de éxito
          window.location.href = "https://zanahorio326.github.io/Mal-comienzo/chat.html";
        })
        .catch((error) => {
          // Mostrar mensaje de error
          registerError.textContent = "Error al registrarse: " + error.message;
        });
    });
  </script>
</body>
</html>
