<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro / Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-auth.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
      authDomain: "thegame-5afaa.firebaseapp.com",
      databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
      projectId: "thegame-5afaa",
      storageBucket: "thegame-5afaa.firebasestorage.app",
      messagingSenderId: "588556182984",
      appId: "1:588556182984:web:a0557067d35c18e3944cfd",
      measurementId: "G-9M3CBJ3LV9"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function registerUser() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          // Registro exitoso
          window.location.href = "https://zanahorio326.github.io/Mal-comienzo/chat.html";
        })
        .catch((error) => {
          console.error(error.message);
          alert("Error al registrarse: " + error.message);
        });
    }

    function loginUser() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          // Inicio de sesión exitoso
          window.location.href = "https://zanahorio326.github.io/Mal-comienzo/chat.html";
        })
        .catch((error) => {
          console.error(error.message);
          alert("Error al iniciar sesión: " + error.message);
        });
    }
  </script>
</head>
<body>
  <h2>Registro</h2>
  <form id="registerForm">
    <label for="email">Correo Electrónico:</label>
    <input type="email" id="email" required>
    <br><br>
    <label for="password">Contraseña:</label>
    <input type="password" id="password" required>
    <br><br>
    <button type="button" onclick="registerUser()">Registrar</button>
  </form>

  <h2>Iniciar sesión</h2>
  <form id="loginForm">
    <label for="email">Correo Electrónico:</label>
    <input type="email" id="email" required>
    <br><br>
    <label for="password">Contraseña:</label>
    <input type="password" id="password" required>
    <br><br>
    <button type="button" onclick="loginUser()">Iniciar sesión</button>
  </form>
</body>
</html>
