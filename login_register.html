<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-auth.js"></script>
</head>
<body>
    <h2>Registro</h2>

    <form id="registro-form">
        <div>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" required>
        </div>
        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Registrarse</button>
    </form>

    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicialización de Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Obtener elementos del formulario
        const form = document.getElementById("registro-form");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        // Manejo del registro
        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const email = emailInput.value;
            const password = passwordInput.value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    alert("Registro exitoso");
                    // Redirigir al chat después del registro exitoso
                    window.location.href = "https://zanahorio326.github.io/Mal-comienzo/chat.html";
                })
                .catch((error) => {
                    const errorMessage = error.message;
                    alert("Error: " + errorMessage);
                });
        });
    </script>
</body>
</html>
