<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Registro</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    .container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .error {
      color: red;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Iniciar sesión o Registrarse</h2>

    <!-- Botones de selección de Login o Registro -->
    <div>
      <button onclick="showLogin()">Iniciar sesión</button>
      <button onclick="showRegister()">Registrarse</button>
    </div>

    <!-- Formulario de Login -->
    <div id="loginForm" style="display: none;">
      <h3>Iniciar sesión</h3>
      <label for="loginEmail">Correo electrónico</label>
      <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
      
      <label for="loginPassword">Contraseña</label>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
      
      <button id="loginSubmit">Iniciar sesión</button>
      <p class="error" id="loginError"></p>
    </div>

    <!-- Formulario de Registro -->
    <div id="registerForm" style="display: none;">
      <h3>Registrarse</h3>
      <label for="username">Nombre de usuario</label>
      <input type="text" id="username" placeholder="Nombre de usuario" required>
      
      <label for="registerEmail">Correo electrónico</label>
      <input type="email" id="registerEmail" placeholder="Correo electrónico" required>
      
      <label for="registerPassword">Contraseña</label>
      <input type="password" id="registerPassword" placeholder="Contraseña" required>
      
      <button id="registerSubmit">Registrarse</button>
      <p class="error" id="registerError"></p>
    </div>
  </div>

  <!-- Firebase SDK y código para autenticación -->
  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
      authDomain: "thegame-5afaa.firebaseapp.com",
      databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
      projectId: "thegame-5afaa",
      storageBucket: "thegame-5afaa.firebasestorage.app",
      messagingSenderId: "588556182984",
      appId: "1:588556182984:web:a0557067d35c18e3944cfd",
      measurementId: "G-9M3CBJ3LV9"
    };

    // Inicializar Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Función para mostrar el formulario de login
    function showLogin() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('registerForm').style.display = 'none';
    }

    // Función para mostrar el formulario de registro
    function showRegister() {
      document.getElementById('registerForm').style.display = 'block';
      document.getElementById('loginForm').style.display = 'none';
    }

    // Iniciar sesión
    document.getElementById('loginSubmit').addEventListener('click', function() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      console.log('Intentando iniciar sesión...'); // Debugging

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          console.log('Login exitoso!'); // Debugging
          window.location.href = "https://zanahorio326.github.io/Mal-comienzo/chat.html";
        })
        .catch((error) => {
          const errorMessage = error.message;
          console.log('Error en login:', errorMessage); // Debugging
          document.getElementById('loginError').textContent = "Error: " + errorMessage;
        });
    });

    // Registrarse
    document.getElementById('registerSubmit').addEventListener('click', function() {
      const username = document.getElementById('username').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      console.log('Intentando registrarse...'); // Debugging

      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          console.log('Registro exitoso!'); // Debugging
          window.location.href = "https://zanahorio326.github.io/Mal-comienzo/chat.html";
        })
        .catch((error) => {
          const errorMessage = error.message;
          console.log('Error en registro:', errorMessage); // Debugging
          document.getElementById('registerError').textContent = "Error: " + errorMessage;
        });
    });
  </script>
  
</body>
</html>
