<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            width: 300px;
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px gray;
            border-radius: 10px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid gray;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Iniciar sesión / Registrarse</h2>
    <input type="text" id="username" placeholder="Nombre de usuario">
    <input type="password" id="password" placeholder="Contraseña">
    <button onclick="register()">Registrarse</button>
    <button onclick="login()">Iniciar sesión</button>
</div>

<script>
    // Configuración de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
        authDomain: "thegame-5afaa.firebaseapp.com",
        databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
        projectId: "thegame-5afaa",
        storageBucket: "thegame-5afaa.appspot.com",
        messagingSenderId: "588556182984",
        appId: "1:588556182984:web:a0557067d35c18e3944cfd",
        measurementId: "G-9M3CBJ3LV9"
    };

    // Inicializar Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    alert("Firebase cargado correctamente");

    function register() {
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;

        if (username === "" || password === "") {
            alert("Por favor, completa todos los campos.");
            return;
        }

        let userRef = database.ref("users/" + username);
        
        userRef.once("value", function(snapshot) {
            if (snapshot.exists()) {
                alert("Este nombre de usuario ya está en uso.");
            } else {
                userRef.set({
                    password: password
                });
                alert("Registro exitoso. Redirigiendo al chat...");
                window.location.href = "chat.html";
            }
        });
    }

    function login() {
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;

        if (username === "" || password === "") {
            alert("Por favor, completa todos los campos.");
            return;
        }

        let userRef = database.ref("users/" + username);

        userRef.once("value", function(snapshot) {
            if (snapshot.exists() && snapshot.val().password === password) {
                alert("Inicio de sesión exitoso. Redirigiendo al chat...");
                window.location.href = "chat.html";
            } else {
                alert("Nombre de usuario o contraseña incorrectos.");
            }
        });
    }
</script>

</body>
</html>
