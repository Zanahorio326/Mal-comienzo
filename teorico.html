<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botón Minar</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'chat');

        const username = localStorage.getItem("username") || "Desconocido";

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("btnMinar").addEventListener("click", function() {
                const btn = this;
                const mensajeInicio = "Minando..."; // Mensaje al iniciar
                const mensajeFin = "Minado!"; // Mensaje al terminar

                // Desactivar el botón y cambiar el texto a "Picando..."
                btn.disabled = true;
                btn.textContent = "⛏️ Picando...";

                // Enviar mensaje de inicio al chat
                push(chatRef, {
                    usuario: username,
                    texto: mensajeInicio,
                    timestamp: Date.now()
                });

                // Esperar 5 segundos antes de finalizar el proceso
                setTimeout(function() {
                    // Rehabilitar el botón y cambiar el texto a "Minar"
                    btn.disabled = false;
                    btn.textContent = "⛏️ Minar";

                    // Enviar mensaje de fin al chat
                    push(chatRef, {
                        usuario: username,
                        texto: mensajeFin,
                        timestamp: Date.now()
                    });
                }, 5000); // 5 segundos de espera
            });
        });
    </script>
</head>
<body>
    <button id="btnMinar">⛏️ Minar</button>
</body>
</html>
