<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teorico - Inventario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .cuadro {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 150px;
        }

        .cuadro h3 {
            font-size: 18px;
            color: #333;
        }

        .cuadro p {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cuadro img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        /* Ajustes responsivos */
        @media (max-width: 600px) {
            .cuadro {
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="cuadro">
            <img src="https://via.placeholder.com/50" alt="Icono 1">
            <h3>Elemento 1</h3>
            <p>Descripción del primer elemento en el inventario. Esto es solo un ejemplo.</p>
        </div>
        <div class="cuadro">
            <img src="https://via.placeholder.com/50" alt="Icono 2">
            <h3>Elemento 2</h3>
            <p>Descripción del segundo elemento. Puedes colocar más detalles aquí.</p>
        </div>
        <div class="cuadro">
            <img src="https://via.placeholder.com/50" alt="Icono 3">
            <h3>Elemento 3</h3>
            <p>Un tercer elemento en el inventario. Texto de ejemplo.</p>
        </div>
        <!-- Agregar más cuadros según sea necesario -->
    </div>
</body>
</html>
