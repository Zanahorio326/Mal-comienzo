<!DOCTYPE html>    
<html lang="es">    
<head>    
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Botón Minar</title>    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #4caf50, #ff9800);
            color: white;
            text-align: center;
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Estilo para el botón "Poder" */
        .boton-poder {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: white;
            font-size: 18px;
            text-transform: uppercase;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 30px;
            animation: gradiente 2s ease infinite;
        }

        .boton-poder:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        @keyframes gradiente {
            0% {
                background-position: 200% 0;
            }
            50% {
                background-position: 0 100%;
            }
            100% {
                background-position: 200% 0;
            }
        }
    </style>    
    <script type="module">    
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";    
        import { getDatabase, ref, push, get, update, child } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";    
    
        const firebaseConfig = {    
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",    
            authDomain: "thegame-5afaa.firebaseapp.com",    
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",    
            projectId: "thegame-5afaa",    
            storageBucket: "thegame-5afaa.firebasestorage.app",    
            messagingSenderId: "588556182984",    
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",    
            measurementId: "G-9M3CBJ3LV9"    
        };    
    
        const app = initializeApp(firebaseConfig);    
        const db = getDatabase(app);    
    
        const username = localStorage.getItem("username") || "Desconocido";    
        const userRef = ref(db, 'users/' + username);    
    
        document.addEventListener("DOMContentLoaded", function() {    
            document.getElementById("btnMinar").addEventListener("click", function() {    
                const btn = this;    
                btn.disabled = true;    
                btn.textContent = "⛏️ Picando...";    
    
                // Enviar mensaje al chat de que está minando    
                push(ref(db, 'chat'), {    
                    usuario: username,    
                    texto: "Minando...",    
                    timestamp: Date.now()    
                });    
    
                setTimeout(function() {    
                    const resultado = obtenerMineral();    
                    let mensaje = "";    
    
                    if (resultado === "Nada") {    
                        mensaje = "No encontré nada...";    
                    } else {    
                        mensaje = `Encontré ${resultado}`;    
                        // Actualizar el inventario del jugador    
                        actualizarInventario(resultado);    
                    }    
    
                    // Enviar el mensaje de resultado al chat    
                    push(ref(db, 'chat'), {    
                        usuario: username,    
                        texto: mensaje,    
                        timestamp: Date.now()    
                    });    
    
                    btn.disabled = false;    
                    btn.textContent = "⛏️ Minar";    
                }, 5000);    
            });    
    
            // Función para obtener el mineral    
            function obtenerMineral() {    
                const probabilidad = Math.random() * 100;    
    
                if (probabilidad < 40) return "Nada";    
                if (probabilidad < 65) return "Carbón";    
                if (probabilidad < 83) return "Cobre";    
                if (probabilidad < 93) return "Hierro";    
                if (probabilidad < 98) return "Plata";    
                return "Oro";    
            }    
    
            // Función para actualizar el inventario del jugador    
            function actualizarInventario(mineral) {    
                // Obtener el inventario actual del jugador    
                get(userRef).then((snapshot) => {    
                    if (snapshot.exists()) {    
                        const inventory = snapshot.val().inventory || {    
                            carbon: 0,    
                            cobre: 0,    
                            hierro: 0,    
                            plata: 0,    
                            oro: 0    
                        };    
                            
                        // Si el mineral ya está en el inventario, incrementamos la cantidad    
                        if (inventory[mineral]) {    
                            inventory[mineral] += 1;    
                        } else {    
                            inventory[mineral] = 1; // Si no está, lo añadimos con cantidad 1    
                        }    
    
                        // Actualizamos el inventario en Firebase    
                        update(userRef, {    
                            inventory: inventory    
                        }).then(() => {    
                            console.log(`Inventario actualizado con ${mineral}`);    
                        }).catch((error) => {    
                            console.error("Error al actualizar el inventario: ", error);    
                        });    
                    }    
                }).catch((error) => {    
                    console.error("Error al obtener el inventario: ", error);    
                });    
            }    
        });    
    </script>    
</head>    
<body>    
    <button id="btnMinar">⛏️ Minar</button>    
    <!-- Botón "Poder" para redirigir -->
    <a href="https://zanahorio326.github.io/Mal-comienzo/prestigio.html" class="boton-poder">Poder</a>
</body>    
</html>
