<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escritura en Tiempo Real</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
</head>
<body>
    <h2>Escribe algo y lo verán todos en tiempo real:</h2>
    <input type="text" id="mensaje" oninput="actualizarTexto()" placeholder="Escribe aquí...">
    <p><strong>Texto compartido:</strong> <span id="textoCompartido"></span></p>

    <script>
        // Configuración de Firebase (usa la tuya)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            databaseURL: "https://TU_PROYECTO.firebaseio.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const ref = db.ref("textoCompartido");

        // Actualiza el texto en la base de datos cuando alguien escribe
        function actualizarTexto() {
            const texto = document.getElementById("mensaje").value;
            ref.set(texto);
        }

        // Escucha cambios en la base de datos y actualiza en tiempo real
        ref.on("value", (snapshot) => {
            document.getElementById("textoCompartido").innerText = snapshot.val();
        });
    </script>
</body>
</html>
