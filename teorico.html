<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat con Firebase</title>
  <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js"></script>
</head>
<body>
  <h1>Chat en Vivo</h1>
  <!-- Autenticación -->
  <div id="auth-container">
    <button id="login-button">Iniciar Sesión</button>
    <button id="logout-button" style="display: none;">Cerrar Sesión</button>
  </div>

  <!-- Interfaz de chat -->
  <div id="chat-container" style="display: none;">
    <div id="chat-box"></div>
    <input type="text" id="message-input" placeholder="Escribe un mensaje...">
    <button id="send-message-button">Enviar</button>
  </div>

  <!-- Eliminar cuenta -->
  <div id="account-container" style="display: none;">
    <button id="delete-account-button">Eliminar mi cuenta</button>
  </div>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
      authDomain: "thegame-5afaa.firebaseapp.com",
      databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
      projectId: "thegame-5afaa",
      storageBucket: "thegame-5afaa.firebasestorage.app",
      messagingSenderId: "588556182984",
      appId: "1:588556182984:web:a0557067d35c18e3944cfd",
      measurementId: "G-9M3CBJ3LV9"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Función para iniciar sesión con Google
    const loginButton = document.getElementById("login-button");
    loginButton.addEventListener("click", function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).then((result) => {
        const user = result.user;
        document.getElementById("auth-container").style.display = "none";
        document.getElementById("chat-container").style.display = "block";
        document.getElementById("logout-button").style.display = "block";
        document.getElementById("account-container").style.display = "block";

        // Guardar usuario en la base de datos
        const userRef = db.ref('usuarios/' + user.uid);
        userRef.set({
          username: user.displayName
        });
      }).catch((error) => {
        console.error(error);
      });
    });

    // Función para cerrar sesión
    const logoutButton = document.getElementById("logout-button");
    logoutButton.addEventListener("click", function() {
      auth.signOut().then(() => {
        document.getElementById("auth-container").style.display = "block";
        document.getElementById("chat-container").style.display = "none";
        document.getElementById("logout-button").style.display = "none";
        document.getElementById("account-container").style.display = "none";
      }).catch((error) => {
        console.error(error);
      });
    });

    // Enviar mensaje al chat
    const sendMessageButton = document.getElementById("send-message-button");
    sendMessageButton.addEventListener("click", function() {
      const messageInput = document.getElementById("message-input");
      const message = messageInput.value.trim();
      if (message) {
        const user = auth.currentUser;
        const messageRef = db.ref('chat').push();
        messageRef.set({
          username: user.displayName,
          message: message
        });
        messageInput.value = "";
      }
    });

    // Mostrar mensajes en el chat
    const chatBox = document.getElementById("chat-box");
    db.ref('chat').on('child_added', function(snapshot) {
      const messageData = snapshot.val();
      const messageElement = document.createElement("div");
      messageElement.innerText = `${messageData.username}: ${messageData.message}`;
      chatBox.appendChild(messageElement);
    });

    // Eliminar cuenta
    const deleteAccountButton = document.getElementById("delete-account-button");
    deleteAccountButton.addEventListener("click", function() {
      const user = auth.currentUser;
      if (user) {
        const userRef = db.ref('usuarios/' + user.uid);
        userRef.remove().then(() => {
          user.delete().then(() => {
            alert("Cuenta eliminada con éxito.");
            auth.signOut().then(() => {
              document.getElementById("auth-container").style.display = "block";
              document.getElementById("chat-container").style.display = "none";
              document.getElementById("logout-button").style.display = "none";
              document.getElementById("account-container").style.display = "none";
            });
          }).catch((error) => {
            console.error("Error al eliminar la cuenta:", error);
          });
        }).catch((error) => {
          console.error("Error al eliminar los datos:", error);
        });
      }
    });
  </script>
</body>
</html>
