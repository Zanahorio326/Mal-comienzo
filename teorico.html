<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadrícula tipo Excel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            align-items: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 100px);
            grid-template-rows: repeat(2, 50px);
            gap: 1px;
            background-color: #ddd;
            border: 1px solid #ddd;
        }
        .grid-item {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            border: 1px solid #ccc;
        }
        .button {
            background-color: #008CBA;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #007B9E;
        }
        .left-button {
            margin-right: 20px;
        }
        .right-button {
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="button left-button">Izquierda</button>
        <div class="grid">
            <div class="grid-item">A1</div>
            <div class="grid-item">A2</div>
            <div class="grid-item">A3</div>
            <div class="grid-item">A4</div>
            <div class="grid-item">A5</div>
            <div class="grid-item">B1</div>
            <div class="grid-item">B2</div>
            <div class="grid-item">B3</div>
            <div class="grid-item">B4</div>
            <div class="grid-item">B5</div>
        </div>
        <button class="button right-button">Derecha</button>
    </div>
</body>
</html>
