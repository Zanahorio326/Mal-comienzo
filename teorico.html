<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let usuarioActual = null;

        // Función para registrar usuario
        window.registrar = async function () {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const nombreUsuario = document.getElementById("nombreUsuario").value.trim();

            if (!/^[a-zA-Z0-9]+$/.test(nombreUsuario)) {
                alert("El nombre de usuario solo puede contener letras y números.");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await set(ref(db, `usuarios/${user.uid}`), { nombreUsuario });

                alert("Registro exitoso, ahora inicia sesión.");
                document.getElementById("email").value = "";
                document.getElementById("password").value = "";
                document.getElementById("nombreUsuario").value = "";
            } catch (error) {
                alert("Error en el registro: " + error.message);
            }
        };

        // Función para iniciar sesión
        window.iniciarSesion = async function () {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("Error al iniciar sesión: " + error.message);
            }
        };

        // Función para enviar mensajes
        window.enviarTexto = async function () {
            const texto = document.getElementById("mensaje").value.trim();

            if (!usuarioActual) {
                alert("Debes iniciar sesión para enviar mensajes.");
                return;
            }

            if (texto === "") {
                alert("No puedes enviar un mensaje vacío.");
                return;
            }

            try {
                const mensajesRef = ref(db, "mensajes");
                await push(mensajesRef, {
                    usuario: usuarioActual.nombreUsuario,
                    mensaje: texto
                });

                document.getElementById("mensaje").value = "";
            } catch (error) {
                alert("Error al enviar mensaje: " + error.message);
            }
        };

        // Escuchar mensajes en tiempo real
        const mensajesRef = ref(db, "mensajes");
        onValue(mensajesRef, (snapshot) => {
            const datos = snapshot.val();
            const historial = document.getElementById("historial");
            historial.innerHTML = "";

            if (datos) {
                Object.values(datos).slice(-5).reverse().forEach(msg => {
                    const div = document.createElement("div");
                    div.className = "mensaje";
                    div.innerHTML = `<span class="usuario">${msg.usuario}:</span> ${msg.mensaje}`;
                    historial.appendChild(div);
                });
            }
        });

        // Detectar cambios en el estado de autenticación
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const usuarioRef = ref(db, `usuarios/${user.uid}`);
                const snapshot = await get(usuarioRef);
                if (snapshot.exists()) {
                    usuarioActual = { uid: user.uid, nombreUsuario: snapshot.val().nombreUsuario };
                    document.getElementById("registro").style.display = "none";
                    document.getElementById("chat").style.display = "block";
                }
            }
        });

    </script>
</head>
<body>
    <!-- Formulario de registro / inicio de sesión -->
    <div id="registro">
        <h2>Registro / Inicio de Sesión</h2>
        <input type="email" id="email" placeholder="Correo electrónico" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <input type="text" id="nombreUsuario" placeholder="Nombre de usuario" required>
        <button onclick="registrar()">Registrarse</button>
        <button onclick="iniciarSesion()">Iniciar Sesión</button>
    </div>

    <!-- Chat -->
    <div id="chat" style="display: none;">
        <h2>Chat</h2>
        <div id="historial"></div>
        <input type="text" id="mensaje" placeholder="Escribe tu mensaje">
        <button onclick="enviarTexto()">Enviar</button>
    </div>
</body>
</html>
