<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Nombre de Usuario</title>
</head>
<body>
    <div class="card" id="registroCard">
        <h2>Cambiar Nombre de Usuario</h2>
        <input type="email" id="email" placeholder="Correo electrónico" disabled>
        <input type="password" id="password" placeholder="Contraseña">
        <input type="text" id="nuevoUsername" placeholder="Nuevo nombre de usuario (letras y números)">
        <button onclick="cambiarNombreUsuario()">Cambiar nombre de usuario</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let usuarioActual = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioActual = user;
                document.getElementById("email").value = user.email;
            }
        });

        function cambiarNombreUsuario() {
            const nuevoUsername = document.getElementById("nuevoUsername").value;

            if (nuevoUsername.match(/^[a-zA-Z0-9]+$/)) {
                if (usuarioActual) {
                    const user = usuarioActual;
                    const userRef = ref(db, "usuarios/" + user.uid);
                    update(userRef, {
                        username: nuevoUsername
                    }).then(() => {
                        alert("Nombre de usuario actualizado correctamente.");
                    }).catch((error) => {
                        alert("Error al actualizar el nombre de usuario: " + error.message);
                    });
                }
            } else {
                alert("El nombre de usuario solo puede contener letras y números.");
            }
        }
    </script>
</body>
</html>
