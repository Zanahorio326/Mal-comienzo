<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Identificación de Usuarios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        input {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #4285F4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #357ABD;
        }
        #chat {
            display: none; /* Ocultar el chat inicialmente */
            margin-top: 20px;
        }
        #historial {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
        }
        .mensaje {
            margin: 5px 0;
        }
        .usuario {
            font-weight: bold;
            color: #4285F4;
        }
    </style>
</head>
<body>
    <div class="card" id="registro">
        <h2>Registro</h2>
        <input type="email" id="correo" placeholder="Correo electrónico" required>
        <input type="text" id="nombreUsuario" placeholder="Nombre de usuario (solo texto y números)" required>
        <input type="password" id="contraseña" placeholder="Contraseña" required>
        <button onclick="registrarse()">Registrarse</button>
        <br>
        <button onclick="mostrarLogin()">Iniciar sesión</button>
    </div>

    <div class="card" id="login" style="display: none;">
        <h2>Iniciar sesión</h2>
        <input type="email" id="correoLogin" placeholder="Correo electrónico" required>
        <input type="password" id="contraseñaLogin" placeholder="Contraseña" required>
        <button onclick="iniciarSesion()">Iniciar sesión</button>
        <br>
        <button onclick="mostrarRegistro()">Registrarse</button>
    </div>

    <div id="chat" class="card">
        <h2>Chat en Tiempo Real</h2>
        <input type="text" id="mensaje" placeholder="Escribe aquí...">
        <button onclick="enviarTexto()">Enviar</button>
        <div id="historial"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getDatabase, ref, set, push, get } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let usuarioActual = null;

        // Mostrar formulario de registro
        window.mostrarRegistro = function() {
            document.getElementById("registro").style.display = "block";
            document.getElementById("login").style.display = "none";
        };

        // Mostrar formulario de inicio de sesión
        window.mostrarLogin = function() {
            document.getElementById("registro").style.display = "none";
            document.getElementById("login").style.display = "block";
        };

        // Registro de usuario
        window.registrarse = async function () {
            const correo = document.getElementById("correo").value;
            const nombreUsuario = document.getElementById("nombreUsuario").value;
            const contraseña = document.getElementById("contraseña").value;

            if (!/^[a-zA-Z0-9]+$/.test(nombreUsuario)) {
                alert("El nombre de usuario solo puede contener letras y números.");
                return;
            }

            // Verificar si el nombre de usuario ya existe
            const usuarioRef = ref(db, `usuarios/nombres/${nombreUsuario}`);
            const snapshot = await get(usuarioRef);
            if (snapshot.exists()) {
                alert("El nombre de usuario ya está en uso. Elige otro.");
                return;
            }

            // Crear cuenta con correo electrónico y contraseña
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, correo, contraseña);
                const user = userCredential.user;
                // Guardar el nombre de usuario en la base de datos
                await set(ref(db, `usuarios/${user.uid}`), {
                    nombreUsuario: nombreUsuario
                });
                await set(ref(db, `usuarios/nombres/${nombreUsuario}`), user.uid);

                usuarioActual = { uid: user.uid, nombreUsuario: nombreUsuario };
                mostrarChat();
                alert("¡Bienvenido, " + nombreUsuario + "!");
            } catch (error) {
                alert("Error al registrarse: " + error.message);
            }
        };

        // Inicio de sesión
        window.iniciarSesion = async function () {
            const correo = document.getElementById("correoLogin").value;
            const contraseña = document.getElementById("contraseñaLogin").value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, correo, contraseña);
                const user = userCredential.user;
                // Obtener nombre de usuario de la base de datos
                const usuarioRef = ref(db, `usuarios/${user.uid}`);
                const snapshot = await get(usuarioRef);
                if (snapshot.exists()) {
                    usuarioActual = { uid: user.uid, nombreUsuario: snapshot.val().nombreUsuario };
                    mostrarChat();
                    alert("¡Bienvenido de nuevo, " + usuarioActual.nombreUsuario + "!");
                } else {
                    alert("No se encontró el usuario.");
                }
            } catch (error) {
                alert("Error al iniciar sesión: " + error.message);
            }
        };

        // Función para mostrar el chat
        function mostrarChat() {
            document.getElementById("registro").style.display = "none"; // Ocultar el formulario de registro
            document.getElementById("login").style.display = "none"; // Ocultar el formulario de login
            document.getElementById("chat").style.display = "block"; // Mostrar el chat
        }

        // Funcionalidad para enviar mensajes en el chat
        window.enviarTexto = function () {
            const texto = document.getElementById("mensaje").value;
            if (texto.trim() !== "" && usuarioActual) {
                const mensajesRef = ref(db, "mensajes");
                push(mensajesRef, {
                    usuario: usuarioActual.nombreUsuario,
                    mensaje: texto
                });
                document.getElementById("mensaje").value = ""; // Limpiar el campo de mensaje
            }
        };

        // Mostrar los mensajes en tiempo real
        const mensajesRef = ref(db, "mensajes");
        onValue(mensajesRef, (snapshot) => {
            const datos = snapshot.val();
            const historial = document.getElementById("historial");
            historial.innerHTML = "";

            if (datos) {
                const mensajes = Object.values(datos).slice(-5).reverse();
                mensajes.forEach(msg => {
                    const div = document.createElement("div");
                    div.className = "mensaje";
                    div.innerHTML = `<span class="usuario">${msg.usuario}:</span> ${msg.mensaje}`;
                    historial.appendChild(div);
                });
            }
        });
    </script>
</body>
</html>
