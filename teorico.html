<!DOCTYPE html>  
<html lang="es">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Sección: Minar y Talar</title>  
  <script type="module">  
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";  
    import { getDatabase, ref, push, get, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";  
  
    const firebaseConfig = {  
      apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",  
      authDomain: "thegame-5afaa.firebaseapp.com",  
      databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",  
      projectId: "thegame-5afaa",  
      storageBucket: "thegame-5afaa.firebasestorage.app",  
      messagingSenderId: "588556182984",  
      appId: "1:588556182984:web:a0557067d35c18e3944cfd",  
      measurementId: "G-9M3CBJ3LV9"  
    };  
  
    const app = initializeApp(firebaseConfig);  
    const db = getDatabase(app);  
  
    const username = localStorage.getItem("username") || "Desconocido";  
    const userRef = ref(db, 'users/' + username);  
  
    let isMining = false;  
  
    document.addEventListener("DOMContentLoaded", function() {  
      document.getElementById("btnMinar").addEventListener("click", function() {  
        if (isMining) return;  
  
        isMining = true;  
        const btn = this;  
        btn.disabled = true;  
        btn.textContent = "Picando... 💥⛏️";  
  
        push(ref(db, 'chat'), {  
          usuario: username,  
          texto: "*(Minando... 🪨💥⛏️)🏔️🏔️🏔️⛰️🏔️⛰️🏔️⛰️⛰️⛰️⛰️⛰️🌾🪨🌾🪨🌾🌾🌾🌲🌾🌲🌾🌳🌲🌳🌲🌳🌲",  
          timestamp: Date.now()  
        });  
  
        setTimeout(function() {  
          const resultado = obtenerMineral();  
          let mensaje = resultado === "Nada" ? "-_- No encontré nada..." : `:D Encontré ${resultado}`;  
  
          if (resultado !== "Nada") actualizarInventario(resultado.toLowerCase());  
  
          push(ref(db, 'chat'), {  
            usuario: username,  
            texto: mensaje,  
            timestamp: Date.now()  
          });  
  
          btn.disabled = false;  
          btn.textContent = "⛏️ Minar";  
          isMining = false;  
        }, 15000);  
      });  
  
      function obtenerMineral() {  
        const probabilidad = Math.random() * 100;  
        return probabilidad < 40 ? "Nada" :   
               probabilidad < 65 ? "carbón" :   
               probabilidad < 83 ? "cobre" :   
               probabilidad < 93 ? "hierro" :   
               probabilidad < 98 ? "plata" : "oro";  
      }  
  
      function actualizarInventario(mineral) {  
        get(userRef).then((snapshot) => {  
          if (snapshot.exists()) {  
            const inventory = snapshot.val().inventory || { carbón: 0, cobre: 0, hierro: 0, plata: 0, oro: 0, madera: 0 };  
            inventory[mineral] = (inventory[mineral] || 0) + 1;  
  
            update(userRef, { inventory })  
              .then(() => console.log(`Inventario actualizado con ${mineral}`))  
              .catch((error) => console.error("Error al actualizar el inventario: ", error));  
          }  
        }).catch((error) => console.error("Error al obtener el inventario: ", error));  
      }  
  
      document.getElementById("btnTalar").addEventListener("click", function() {  
        if (isMining) return;  
  
        isMining = true;  
        const btn = this;  
        btn.disabled = true;  
        btn.textContent = "Talando... 🌳🪓";  
  
        push(ref(db, 'chat'), {  
          usuario: username,  
          texto: "*(Talando... 🌳💥🪓)🌳🌲🌳🌲🌳🌲🌳🌲🌳🌲🌳🌲🌳🌲🌳",  
          timestamp: Date.now()  
        });  
  
        setTimeout(function() {  
          const resultado = obtenerMadera();  
          let mensaje = resultado === "Nada" ? "No puedo llevarme este tronco 🪵 ¡pesa demasiado! >:/" :   
                        resultado === "Tropezón" ? "Demonios, caí al tropezar con una raíz =_= espero no haber perdido nada de la mochila 🎒" :   
                        "Este tronco 🪵 me servirá bastante :)";  
  
          if (resultado === "madera") actualizarInventario("madera");  
  
          push(ref(db, 'chat'), {  
            usuario: username,  
            texto: mensaje,  
            timestamp: Date.now()  
          });  
  
          btn.disabled = false;  
          btn.textContent = "🪓 Talar";  
          isMining = false;  
        }, 15000);  
      });  
  
      function obtenerMadera() {  
        const probabilidad = Math.random() * 100;  
        return probabilidad < 60 ? "Nada" :   
               probabilidad < 80 ? "Tropezón" : "madera";  
      }  
  
      document.getElementById("mostrarSegunda").addEventListener("click", function(e) {  
        e.preventDefault();  
        const iframe = document.getElementById("segundaParte1");  
        iframe.style.display = (iframe.style.display === "block") ? "none" : "block";  
      });  
  
      document.getElementById("mostrarTercera").addEventListener("click", function(e) {  
        e.preventDefault();  
        const iframe = document.getElementById("segundaParte2");  
        iframe.style.display = (iframe.style.display === "block") ? "none" : "block";  
      });  
  
      // --- Nueva herramienta: Pala (Excavar) ---  
      document.getElementById("btnExcavar").addEventListener("click", function() {  
        if (isMining) return;  
  
        isMining = true;  
        const btn = this;  
        btn.disabled = true;  
        btn.textContent = "Excavando... ⏳";  
  
        // Desactivar otros botones  
        document.getElementById("btnMinar").disabled = true;  
        document.getElementById("btnTalar").disabled = true;  
  
        push(ref(db, 'chat'), {  
          usuario: username,  
          texto: "*(Excavando... 🕳️)🏞️🪣🌱🌿🌱🌿🌱🌿🌾🌿🌾🌿🌾🌿🌿🌿🌿🌿🌿🌿🌿",  
          timestamp: Date.now()  
        });  
  
        setTimeout(function() {  
          const probabilidad = Math.random() * 100;  
          let mensaje = "";  
          if (probabilidad < 80) {  
            mensaje = "Aquí sólo encontré tierra (ーー;)";  
          } else if (probabilidad < 95) {  
            mensaje = "Esta arena será muy útil en el futuro (^_^.)";  
            actualizarInventario("arena");  
          } else {  
            mensaje = "¡Parece que encontré algunas raíces! (/◕ヮ◕)/🫚";  
            actualizarInventario("raíces");  
          }  
  
          push(ref(db, 'chat'), {  
            usuario: username,  
            texto: mensaje,  
            timestamp: Date.now()  
          });  
  
          // Reactivar botones  
          btn.disabled = false;  
          btn.textContent = "𝆺𝅥 Excavar";  
          document.getElementById("btnMinar").disabled = false;  
          document.getElementById("btnTalar").disabled = false;  
          isMining = false;  
        }, 10000);  
      });  
      // --- Fin de la nueva herramienta ---  
    });  
  </script>  
  <style>  
    #segundaParte1, #segundaParte2 {  
      width: 100%;  
      height: 500px;  
      border: none;  
      display: none;  
      margin: 0;  
      padding: 0;  
    }  
    .enlace-estilo {  
      border: 1px solid;  
      padding: 5px;  
      width: 70px;  
      text-align: center;  
      color: white;  
      background-color: gray;  
      font-size: 12px;  
      cursor: pointer;  
    }  
  </style>  
</head>  
<body>  
  <div style="border: 1px solid; padding: 5px; width: 70px; text-align: center; color: white; background-color: gray; font-size: 12px;">  
    Acción  
  </div>  
  <br>  
  <button id="btnMinar">⛏️ Minar</button>  
  <br><br>  
  <button id="btnTalar">🪓 Talar</button>  
  <br><br>  
  <button id="btnExcavar">𝆺𝅥 Excavar</button>  
  <br><br>  
  <hr>  
  <div id="mostrarSegunda" class="enlace-estilo">Crafteos 🔨</div>  
  <iframe id="segundaParte1" src="https://zanahorio326.github.io/Mal-comienzo/crafteos.html"></iframe>  
  <br>  
  <div id="mostrarTercera" class="enlace-estilo">Zonas 🗺️</div>  
  <iframe id="segundaParte2" src="https://zanahorio326.github.io/Mal-comienzo/zonas.html"></iframe>  
</body>  
</html>
