<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Tiempo Real</title>
    <style>
        #historial {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
        }
        p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h2>Dinner Code:</h2>
    <input type="text" id="mensaje" placeholder="Escribe aquí...">
    <button onclick="enviarTexto()">Enviar</button>
    <div id="historial"></div>

    <script>
        import("https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js").then(({ initializeApp }) => {
            import("https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js").then(({ getDatabase, ref, push, onValue, set }) => {

                // Configuración de Firebase
                const firebaseConfig = {
                    apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
                    authDomain: "thegame-5afaa.firebaseapp.com",
                    databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
                    projectId: "thegame-5afaa",
                    storageBucket: "thegame-5afaa.firebasestorage.app",
                    messagingSenderId: "588556182984",
                    appId: "1:588556182984:web:a0557067d35c18e3944cfd",
                    measurementId: "G-9M3CBJ3LV9"
                };

                // Inicializar Firebase
                const app = initializeApp(firebaseConfig);
                const db = getDatabase(app);
                const mensajesRef = ref(db, "mensajes");

                // Enviar mensaje
                window.enviarTexto = function () {
                    const texto = document.getElementById("mensaje").value;
                    if (texto.trim() !== "") {
                        push(mensajesRef, texto);
                        document.getElementById("mensaje").value = "";
                    }
                };

                // Escuchar cambios y mostrar los últimos 5 mensajes
                onValue(mensajesRef, (snapshot) => {
                    const datos = snapshot.val();
                    const historial = document.getElementById("historial");
                    historial.innerHTML = ""; 

                    if (datos) {
                        // Mostrar los últimos 5 mensajes, invertidos para que los nuevos aparezcan arriba
                        const mensajes = Object.values(datos).slice(-5).reverse(); 
                        mensajes.forEach(msg => {
                            const p = document.createElement("p");
                            p.textContent = msg;
                            historial.appendChild(p);
                        });

                        // Limitar la base de datos a solo 5 mensajes
                        if (Object.keys(datos).length > 5) {
                            const primerasClaves = Object.keys(datos).slice(0, Object.keys(datos).length - 5);
                            primerasClaves.forEach(clave => set(ref(db, `mensajes/${clave}`), null)); 
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
