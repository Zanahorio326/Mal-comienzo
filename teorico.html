<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Registro y Nombre de Usuario</title>
</head>
<body>
    <h2>Bienvenido al chat</h2>

    <!-- Sección de registro -->
    <div id="registro">
        <h3>Regístrate para participar</h3>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <input type="text" id="username" placeholder="Nombre de usuario (letras y números)">
        <button onclick="registrarUsuario()">Registrar</button>
        <p id="errorRegistro"></p>
    </div>

    <!-- Sección de chat -->
    <div id="chat" style="display:none;">
        <h3>Bienvenido al chat</h3>
        <p>Nombre de usuario: <span id="nombreUsuario"></span></p>
        <textarea id="mensaje" placeholder="Escribe un mensaje..."></textarea><br>
        <button onclick="enviarMensaje()">Enviar mensaje</button>
        <div id="mensajes"></div>
        <button onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <script type="module">
        // Importar las funciones necesarias de Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getDatabase, ref, set, push, get, child } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let usuarioActual = null;

        // Función para registrar un nuevo usuario
        function registrarUsuario() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const username = document.getElementById("username").value;

            // Verificar que el nombre de usuario solo contenga letras y números
            if (!username.match(/^[a-zA-Z0-9]+$/)) {
                document.getElementById("errorRegistro").innerText = "El nombre de usuario solo puede contener letras y números.";
                return;
            }

            // Verificar que el nombre de usuario no esté registrado
            const userRef = ref(db, "usuarios");
            get(userRef).then((snapshot) => {
                let usernameTaken = false;
                snapshot.forEach((childSnapshot) => {
                    if (childSnapshot.val().username === username) {
                        usernameTaken = true;
                    }
                });

                if (usernameTaken) {
                    document.getElementById("errorRegistro").innerText = "Este nombre de usuario ya está en uso.";
                    return;
                }

                // Crear el nuevo usuario en Firebase
                createUserWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        const user = userCredential.user;
                        // Guardar el nombre de usuario en la base de datos
                        set(ref(db, 'usuarios/' + user.uid), {
                            username: username,
                            email: user.email
                        }).then(() => {
                            usuarioActual = user;
                            document.getElementById("registro").style.display = "none";
                            document.getElementById("chat").style.display = "block";
                            document.getElementById("nombreUsuario").innerText = username;
                        });
                    })
                    .catch((error) => {
                        document.getElementById("errorRegistro").innerText = "Error al registrar: " + error.message;
                    });
            });
        }

        // Función para enviar un mensaje
        function enviarMensaje() {
            const mensaje = document.getElementById("mensaje").value;
            if (mensaje.trim() !== "") {
                const user = usuarioActual;
                const userRef = ref(db, "mensajes");
                const newMessageRef = push(userRef);
                set(newMessageRef, {
                    username: user.email,
                    message: mensaje
                }).then(() => {
                    document.getElementById("mensaje").value = "";
                    cargarMensajes();
                });
            }
        }

        // Función para cargar los mensajes del chat
        function cargarMensajes() {
            const mensajesRef = ref(db, "mensajes");
            get(mensajesRef).then((snapshot) => {
                const mensajesDiv = document.getElementById("mensajes");
                mensajesDiv.innerHTML = "";
                snapshot.forEach((childSnapshot) => {
                    const message = childSnapshot.val();
                    const p = document.createElement("p");
                    p.textContent = `${message.username}: ${message.message}`;
                    mensajesDiv.appendChild(p);
                });
            });
        }

        // Función para cerrar sesión
        function cerrarSesion() {
            signOut(auth).then(() => {
                document.getElementById("chat").style.display = "none";
                document.getElementById("registro").style.display = "block";
                document.getElementById("email").value = "";
                document.getElementById("password").value = "";
                document.getElementById("username").value = "";
            }).catch((error) => {
                console.log("Error al cerrar sesión: ", error);
            });
        }

        // Detectar cambios de estado de autenticación
        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioActual = user;
                document.getElementById("registro").style.display = "none";
                document.getElementById("chat").style.display = "block";
                cargarMensajes();
                // Mostrar el nombre de usuario en el chat
                const userRef = ref(db, "usuarios/" + user.uid);
                get(userRef).then((snapshot) => {
                    if (snapshot.exists()) {
                        document.getElementById("nombreUsuario").innerText = snapshot.val().username;
                    }
                });
            }
        });
    </script>
</body>
</html>
