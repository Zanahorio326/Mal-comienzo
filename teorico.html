<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat con autenticación Firebase</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .chat-box { display: none; background: white; padding: 20px; border-radius: 10px; }
    .messages { max-height: 300px; overflow-y: auto; margin-bottom: 10px; text-align: left; }
    .message { padding: 5px; border-bottom: 1px solid #ddd; }
    .message .username { font-weight: bold; }
    .input-container { display: flex; }
    .input-container input { flex: 1; padding: 10px; }
    .input-container button { padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
    .input-container button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Iniciar sesión con Google</h2>
    <button id="login-google">Iniciar sesión con Google</button>

    <div id="username-setup" style="display: none;">
      <h3>Elige un nombre de usuario</h3>
      <input type="text" id="username" placeholder="Solo letras y números">
      <button id="set-username">Guardar</button>
      <p id="error-message" style="color: red;"></p>
    </div>

    <div id="chat" class="chat-box">
      <h2>Bienvenido, <span id="user-name"></span></h2>
      <div class="messages" id="messages"></div>
      <div class="input-container">
        <input type="text" id="message-input" placeholder="Escribe un mensaje...">
        <button id="send-message">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
      authDomain: "thegame-5afaa.firebaseapp.com",
      databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
      projectId: "thegame-5afaa",
      storageBucket: "thegame-5afaa.appspot.com",
      messagingSenderId: "588556182984",
      appId: "1:588556182984:web:a0557067d35c18e3944cfd",
      measurementId: "G-9M3CBJ3LV9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    let currentUser = null;
    let currentUsername = "";

    // Iniciar sesión con Google
    document.getElementById('login-google').addEventListener('click', function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).then(result => {
        currentUser = result.user;
        checkUsername();
      }).catch(error => {
        console.error("Error en el inicio de sesión:", error);
      });
    });

    // Verificar si el usuario ya tiene un nombre de usuario
    function checkUsername() {
      if (currentUser) {
        database.ref('users/' + currentUser.uid).once('value').then(snapshot => {
          if (snapshot.exists()) {
            currentUsername = snapshot.val().username;
            showChat();
          } else {
            document.getElementById('username-setup').style.display = 'block';
          }
        });
      }
    }

    // Guardar nombre de usuario
    document.getElementById('set-username').addEventListener('click', function() {
      const username = document.getElementById('username').value.trim();

      // Validar que solo tenga letras y números
      if (!/^[a-zA-Z0-9]+$/.test(username)) {
        document.getElementById('error-message').textContent = 'Solo se permiten letras y números.';
        return;
      }

      // Verificar que el nombre de usuario no esté en uso
      database.ref('users').orderByChild('username').equalTo(username).once('value')
        .then(snapshot => {
          if (snapshot.exists()) {
            document.getElementById('error-message').textContent = 'Ese nombre de usuario ya está en uso.';
          } else {
            // Guardar el nombre de usuario
            database.ref('users/' + currentUser.uid).set({ username: username });
            currentUsername = username;
            showChat();
          }
        });
    });

    // Mostrar la pantalla de chat
    function showChat() {
      document.getElementById('username-setup').style.display = 'none';
      document.getElementById('login-google').style.display = 'none';
      document.getElementById('chat').style.display = 'block';
      document.getElementById('user-name').textContent = currentUsername;
      loadMessages();
    }

    // Enviar mensaje
    document.getElementById('send-message').addEventListener('click', function() {
      const messageInput = document.getElementById('message-input');
      const message = messageInput.value.trim();

      if (message) {
        database.ref('messages').push({
          username: currentUsername,
          message: message,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
        messageInput.value = ''; // Limpiar el campo de texto
      }
    });

    // Cargar mensajes en el chat
    function loadMessages() {
      const messagesRef = database.ref('messages');
      messagesRef.orderByChild('timestamp').on('child_added', function(snapshot) {
        const messageData = snapshot.val();
        const messageElement = document.createElement('div');
        messageElement.classList.add('message');
        messageElement.innerHTML = `<span class="username">${messageData.username}:</span> ${messageData.message}`;
        document.getElementById('messages').appendChild(messageElement);
      });
    }
  </script>

</body>
</html>
