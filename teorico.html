<!DOCTYPE html>      
<html lang="es">      
<head>      
    <meta charset="UTF-8">      
    <meta name="viewport" content="width=device-width, initial-scale=1.0">      
    <title>Botón Minar</title>      
    <style>      
        .info-box {      
            border: 2px solid #007bff;      
            padding: 15px;      
            margin-bottom: 20px;      
            background-color: #f0f8ff;      
            color: #0056b3;      
            font-size: 16px;      
            font-family: Arial, sans-serif;      
            border-radius: 8px;      
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);      
        }      
    </style>      
    <script type="module">      
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";      
        import { getDatabase, ref, push, get, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";      
      
        const firebaseConfig = {      
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",      
            authDomain: "thegame-5afaa.firebaseapp.com",      
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",      
            projectId: "thegame-5afaa",      
            storageBucket: "thegame-5afaa.firebasestorage.app",      
            messagingSenderId: "588556182984",      
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",      
            measurementId: "G-9M3CBJ3LV9"      
        };      
      
        const app = initializeApp(firebaseConfig);      
        const db = getDatabase(app);      
      
        const username = localStorage.getItem("username") || "Desconocido";      
        const userRef = ref(db, 'users/' + username);      
      
        let isMining = false; // Variable para evitar realizar dos acciones a la vez (minar y talar)    
  
        document.addEventListener("DOMContentLoaded", function() {      
            document.getElementById("btnMinar").addEventListener("click", function() {      
                if (isMining) return;      
                  
                isMining = true;      
                const btn = this;      
                btn.disabled = true;      
                btn.textContent = "⛏️ Picando...";      
      
                push(ref(db, 'chat'), {      
                    usuario: username,      
                    texto: "Minando...",      
                    timestamp: Date.now()      
                });      
      
                setTimeout(function() {      
                    const resultado = obtenerMineral();      
                    let mensaje = "";      
      
                    if (resultado === "Nada") {      
                        mensaje = "No encontré nada...";      
                    } else {      
                        mensaje = `Encontré ${resultado}`;      
                        actualizarInventario(resultado.toLowerCase());      
                    }      
      
                    push(ref(db, 'chat'), {      
                        usuario: username,      
                        texto: mensaje,      
                        timestamp: Date.now()      
                    });      
      
                    btn.disabled = false;      
                    btn.textContent = "⛏️ Minar";      
                    isMining = false;      
                }, 15000);      
            });      
      
            function obtenerMineral() {      
                const probabilidad = Math.random() * 100;      
                if (probabilidad < 40) return "Nada";      
                if (probabilidad < 65) return "Carbón";      
                if (probabilidad < 83) return "Cobre";      
                if (probabilidad < 93) return "Hierro";      
                if (probabilidad < 98) return "Plata";      
                return "Oro";      
            }      
      
            function actualizarInventario(mineral) {      
                get(userRef).then((snapshot) => {      
                    if (snapshot.exists()) {      
                        const inventory = snapshot.val().inventory || {      
                            carbon: 0,      
                            cobre: 0,      
                            hierro: 0,      
                            plata: 0,      
                            oro: 0      
                        };      
      
                        inventory[mineral] = (inventory[mineral] || 0) + 1;      
      
                        update(userRef, { inventory })      
                        .then(() => console.log(`Inventario actualizado con ${mineral}`))      
                        .catch((error) => console.error("Error al actualizar el inventario: ", error));      
                    }      
                }).catch((error) => console.error("Error al obtener el inventario: ", error));      
            }  
  
            document.getElementById("btnTalar").addEventListener("click", function() {      
                if (isMining) return;      
      
                isMining = true;      
                const btn = this;      
                btn.disabled = true;      
                btn.textContent = "🪓 Talando...";      
      
                push(ref(db, 'chat'), {      
                    usuario: username,      
                    texto: "Talando...",      
                    timestamp: Date.now()      
                });      
      
                setTimeout(function() {      
                    const resultado = obtenerMadera();      
                    let mensaje = "";      
      
                    if (resultado === "Nada") {      
                        mensaje = "Parece que no tuve suerte hoy.";      
                    } else if (resultado === "Tropezón") {      
                        // Enviar siempre el mismo mensaje, independientemente de si pierde algo o no
                        mensaje = "Me tropecé con una rama... Espero no haber dejado caer nada de la mochila";      
                    } else if (resultado === "Madera") {      
                        mensaje = "Logré conseguir un tronco.";      
                        actualizarInventario("madera");      
                    }      
      
                    push(ref(db, 'chat'), {      
                        usuario: username,      
                        texto: mensaje,      
                        timestamp: Date.now()      
                    });      
      
                    btn.disabled = false;      
                    btn.textContent = "🪓 Talando";      
                    isMining = false;      
                }, 15000);      
            });      
      
            function obtenerMadera() {      
                const probabilidad = Math.random() * 100;      
                if (probabilidad < 60) return "Nada";      
                if (probabilidad < 90) return "Tropezón";      
                return "Madera";      
            }      

            // Redirección del botón "Poder" para abrir en ventana completa  
            document.getElementById("btnPoder").addEventListener("click", function() {      
                window.top.location.href = "https://zanahorio326.github.io/Mal-comienzo/prestigio.html";      
            });      

        });      
    </script>      
</head>      
<body>      
    <div class="info-box">      
        <p>Para interactuar con tus herramientas debes tener esta mano en uso, si quitas la mano se cancelará la "acción".</p>      
    </div>      
    <button id="btnMinar">⛏️ Minar</button>      
    <br><br>      
    <button id="btnTalar">🪓 Talando</button>      
    <br><br>      
    <button id="btnPoder">🏆 Poder</button>      
</body>      
</html>
