<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadrícula 6x2 Responsiva con Botones Laterales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            align-items: center;
            background-color: #fff;
            padding: 2%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 800px; /* Ancho máximo para pantallas grandes */
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 columnas de tamaño flexible */
            grid-template-rows: repeat(6, 1fr); /* 6 filas de tamaño flexible */
            gap: 1px;
            background-color: #ddd;
            border: 1px solid #ddd;
            width: 100%;
            height: 50vh; /* Altura relativa a la pantalla */
        }
        .grid-item {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(12px, 2vw, 16px); /* Tamaño de fuente responsivo */
            border: 1px solid #ccc;
        }
        .button {
            background-color: #008CBA;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: clamp(12px, 2vw, 16px); /* Tamaño de fuente responsivo */
            transition: background-color 0.3s ease;
            white-space: nowrap; /* Evita que el texto del botón se divida */
        }
        .button:hover {
            background-color: #007B9E;
        }
        .left-button {
            margin-right: 2%;
        }
        .right-button {
            margin-left: 2%;
        }

        /* Estilos para pantallas pequeñas (móviles) */
        @media (max-width: 600px) {
            .container {
                padding: 5%;
            }
            .grid {
                height: 40vh; /* Ajusta la altura para móviles */
            }
            .button {
                padding: 8px 12px; /* Botones más pequeños en móviles */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="button left-button">Izquierda</button>
        <div class="grid">
            <div class="grid-item">A1</div>
            <div class="grid-item">B1</div>
            <div class="grid-item">A2</div>
            <div class="grid-item">B2</div>
            <div class="grid-item">A3</div>
            <div class="grid-item">B3</div>
            <div class="grid-item">A4</div>
            <div class="grid-item">B4</div>
            <div class="grid-item">A5</div>
            <div class="grid-item">B5</div>
            <div class="grid-item">A6</div>
            <div class="grid-item">B6</div>
        </div>
        <button class="button right-button">Derecha</button>
    </div>
</body>
</html>
