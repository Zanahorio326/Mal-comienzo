<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="welcomeMessage">Bienvenido, <span id="userName">Cargando...</span></div>

    <script>
        // Obtener el nombre del jugador desde localStorage
        const userNameElement = document.getElementById('userName');
        const username = localStorage.getItem('username');
        
        if (username) {
            userNameElement.textContent = username;  // Mostrar el nombre de usuario
        } else {
            userNameElement.textContent = "Jugador no encontrado";
        }
    </script>

</body>
</html>
