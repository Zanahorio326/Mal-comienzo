<!DOCTYPE html>  
<html lang="es">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Combate Medieval</title>  
    <link rel="stylesheet" href="https://zanahorio326.github.io/Mal-comienzo/chat.css">
</head>  
<body>  
    <div id="welcomeMessage">¡Noble luchador <span id="userName">Cargando...</span>! Prepara tu espada para un combate épico.</div>  
    <div id="timer">Tiempo restante: <span id="timeLeft">10</span>s</div>  
    <img id="enemyImage" src="https://zanahorio326.github.io/Mal-comienzo/lobo.jpg" alt="Enemigo">  
    <div id="counter">Golpes de <span id="userNameCounter">Cargando...</span>: <span id="count">0</span></div>  
    <div class="button-container">  
        <button id="leftHook" class="btn">Gancho Izq.</button>  
        <button id="uppercut" class="btn" disabled>Uppercut</button>  
        <button id="rightHook" class="btn">Gancho Der.</button>  
    </div>  
    <div id="overlay">  
        <div class="message-container" id="messageOverlay">  
            <div id="finalMessage">¡Combate terminado!</div>  
            <button class="message-btn" id="newGameBtn">Nuevo Juego</button>  
        </div>  
        <div class="message-container" id="winMessage">  
            <div id="winText">¡Ganaste con <span id="score"></span> golpes!</div>  
            <button class="message-btn" id="continueBtn">Continuar</button>  
        </div>  
        <div class="message-container" id="loseMessage">  
            <div id="loseText">Perdiste. El lobo te derrotó con <span id="scoreLose"></span> golpes.</div>  
            <button class="message-btn" id="retryBtn">Reintentar</button>  
        </div>  
    </div>  
    <div id="lifeBar"><div id="lifeFill"></div></div>  
    <script>  
        const userNameElement = document.getElementById('userName');  
        const userNameCounter = document.getElementById('userNameCounter');  
        const username = localStorage.getItem('username');  
        if (username) { userNameElement.textContent = username; userNameCounter.textContent = username; } else { userNameElement.textContent = "Jugador no encontrado"; userNameCounter.textContent = "Jugador no encontrado"; }  
        let count = 0, timeLeft = 10, timerStarted = false, countdownInterval = null, gameEnded = false;  
        const countDisplay = document.getElementById("count"), timeDisplay = document.getElementById("timeLeft"), leftHook = document.getElementById("leftHook"), rightHook = document.getElementById("rightHook"), uppercut = document.getElementById("uppercut"), overlay = document.getElementById("overlay"), finalMessage = document.getElementById("finalMessage"), welcomeMessage = document.getElementById("welcomeMessage"), counterSection = document.getElementById("counter"), enemyImage = document.getElementById("enemyImage"), lifeFill = document.getElementById("lifeFill"), lifeBar = document.getElementById("lifeBar");  
        const winMessage = document.getElementById('winMessage'), loseMessage = document.getElementById('loseMessage'), messageOverlay = document.getElementById('messageOverlay');  
        const scoreText = document.getElementById('score'), scoreLose = document.getElementById('scoreLose');  
        const newGameBtn = document.getElementById('newGameBtn'), continueBtn = document.getElementById('continueBtn'), retryBtn = document.getElementById('retryBtn');  
        let life = Math.floor(Math.random() * 51) + 50;  
        lifeFill.style.width = (life / 100) * 100 + '%';  
        function updateUppercut() {  
            if (count % 50 === 0 && count > 0) { uppercut.textContent = "¡Uppercut!"; uppercut.classList.add("ready"); uppercut.disabled = false; } else { uppercut.textContent = `Uppercut (${50 - (count % 50)})`; uppercut.classList.remove("ready"); uppercut.disabled = true; }  
        }  
        function startTimer() {  
            if (!timerStarted) {  
                timerStarted = true;  
                countdownInterval = setInterval(() => { timeLeft--; timeDisplay.textContent = timeLeft; if (timeLeft <= 0) { clearInterval(countdownInterval); endFight(); } }, 1000);  
            }  
        }  
        function increaseCounter() {  
            if (!timerStarted) startTimer();   
            if (gameEnded) return;  
            count++; countDisplay.textContent = count;  
            life -= 1; lifeFill.style.width = (life / 100) * 100 + '%';  
            updateUppercut();  
        }  
        function useUppercut() {  
            if (count >= 50) {  
                life -= 20;  
                lifeFill.style.width = (life / 100) * 100 + '%';  
                count -= 50;  
                countDisplay.textContent = count;  
                updateUppercut();  
            }  
        }  
        function endFight() {  
            gameEnded = true;  
            leftHook.disabled = true; rightHook.disabled = true; uppercut.disabled = true;  
            enemyImage.style.opacity = 0;  
            if (life <= 0) {  
                scoreText.textContent = count;  
                winMessage.style.display = 'block';  
                messageOverlay.style.display = 'none';  
            } else {  
                scoreLose.textContent = count;  
                loseMessage.style.display = 'block';  
                messageOverlay.style.display = 'none';  
            }  
            overlay.style.display = "flex";  
        }  
        leftHook.addEventListener("click", () => {   
            increaseCounter();   
            welcomeMessage.style.display = "none";   
            counterSection.style.display = "block";   
            lifeBar.style.display = "block";   
        });  
        rightHook.addEventListener("click", () => {   
            increaseCounter();   
            welcomeMessage.style.display = "none";   
            counterSection.style.display = "block";   
            lifeBar.style.display = "block";   
        });  
        uppercut.addEventListener("click", () => {  
            useUppercut();  
        });  
    </script>  
</body>  
</html>
