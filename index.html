  <!DOCTYPE html>
  <html lang="es">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Space Cube Invaders</title>
      <style>
          body {
              margin: 0;
              background-color: black;
              overflow: hidden;
              font-family: Arial, sans-serif;
          }
          #titulo {
              color: white;
              font-size: 48px;
              text-align: center;
              text-shadow: 2px 2px 4px gray;
              margin-top: 20%;
              position: absolute;
              top: 40%;
              left: 50%;
              transform: translate(-50%, -50%);
          }
          #boton-jugar {
              display: block;
              width: 150px;
              height: 150px;
              background-color: limegreen;
              color: gold;
              font-size: 24px;
              font-weight: bold;
              border: none;
              border-radius: 10px;
              cursor: pointer;
              position: absolute;
              bottom: 0; /* Alineado a la parte inferior */
              left: 50%;
              transform: translate(-50%, 0); /* Centrado horizontalmente */
          }
          #boton-jugar:hover {
              /* Sin efectos de hover */
          }
          #boton-jugar:active {
              /* Sin efectos al pulsar */
          }
          .estrella {
              position: absolute;
              background-color: white;
              border-radius: 50%;
              opacity: 0.8;
          }
      </style>
  </head>
  <body>
      <div id="titulo">Space Cube Invaders</div>
      <button id="boton-jugar" onclick="iniciarJuego()">Jugar</button>
      <script>
          let intervaloBalas;
          let intervaloEstrellas;

          function iniciarJuego() {
              crearEstrellas();
              dispararBalas();
              intervaloEstrellas = setInterval(crearEstrellas, 250); // Generar estrellas cada 1/4 de segundo
              setTimeout(pararGenerarEstrellas, 3000); // Detener generación de estrellas después de 3 segundos
              setTimeout(redirigirPagina, 3500); // Redirigir a otra página después de 3 segundos
          }

          function pararGenerarEstrellas() {
              clearInterval(intervaloEstrellas);
          }

          function redirigirPagina() {
              window.location.href = "https://www.instagram.com/_kevin_sx?igsh=MXUyaHNxb3pybXh4cw==";
          }

          function crearEstrellas() {
              const cantidadEstrellas = Math.random() * 6 + 2; // Generar de 1 a 5 estrellas
              for (let i = 0; i < cantidadEstrellas; i++) {
                  const estrella = document.createElement('div');
                  estrella.classList.add('estrella');
                  estrella.style.width = Math.random() * 3 + 'px';
                  estrella.style.height = estrella.style.width;
                  estrella.style.top = Math.random() * window.innerHeight + 'px';
                  estrella.style.left = Math.random() * window.innerWidth + 'px';
                  document.body.appendChild(estrella);
              }
          }

          function dispararBalas() {
              intervaloBalas = setInterval(() => {
                  dispararBala(-75); // Disparar desde el lado izquierdo
                  dispararBala(75); // Disparar desde el lado derecho
              }, 500); // Intervalo de disparo de balas
          }

          function dispararBala(offsetX) {
              const bala = document.createElement('div');
              bala.style.position = 'absolute';
              bala.style.width = '5px';
              bala.style.height = '20px';
              bala.style.backgroundColor = 'yellow';
              bala.style.left = (window.innerWidth / 2 + offsetX) + 'px'; // Posición relativa al botón
              bala.style.bottom = '150px'; // Posición inicial desde el botón
              document.body.appendChild(bala);
              moverBala(bala);
          }

          function moverBala(bala) {
              let posY = 0;
              const interval = setInterval(() => {
                  if (posY < window.innerHeight) {
                      posY += 5;
                      bala.style.bottom = (parseInt(bala.style.bottom) + 5) + 'px';
                  } else {
                      clearInterval(interval);
                      bala.remove();
                  }
              }, 20);
          }
      </script>
  </body>
  </html>
