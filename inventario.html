<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Mochila</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicialización de Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Obtener el nombre de usuario
        const username = localStorage.getItem("username") || "Desconocido";
        const userRef = ref(db, 'users/' + username);

        // Función para mostrar el inventario del jugador
        function mostrarInventario() {
            // Acceder al inventario del jugador en Firebase
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const inventory = snapshot.val().inventory || {
                        Carbón: 0,
                        Cobre: 0,
                        Hierro: 0,
                        Plata: 0,
                        Oro: 0
                    };

                    // Mostrar el inventario de minerales en el contenedor
                    document.getElementById("carbón").textContent = "Carbón: " + inventory.Carbón;
                    document.getElementById("cobre").textContent = "Cobre: " + inventory.Cobre;
                    document.getElementById("hierro").textContent = "Hierro: " + inventory.Hierro;
                    document.getElementById("plata").textContent = "Plata: " + inventory.Plata;
                    document.getElementById("oro").textContent = "Oro: " + inventory.Oro;
                } else {
                    console.log("No se encontraron datos para el usuario.");
                }
            }).catch((error) => {
                console.error("Error al obtener el inventario: ", error);
            });
        }

        // Llamar a la función de mostrar inventario al cargar la página
        document.addEventListener("DOMContentLoaded", function() {
            mostrarInventario();
        });
    </script>
</head>
<body>
    <h1>Inventario del Jugador</h1>
    <div id="mochila">
        <h3>Inventario</h3>
        <p id="carbón">Carbón: 0</p>
        <p id="cobre">Cobre: 0</p>
        <p id="hierro">Hierro: 0</p>
        <p id="plata">Plata: 0</p>
        <p id="oro">Oro: 0</p>
    </div>
</body>
</html>
