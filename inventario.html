<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario del Usuario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        td {
            background-color: #f9f9f9;
        }
        .small-text {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Inventario de Minerales</h1>
        <table>
            <thead>
                <tr>
                    <th>Mineral</th>
                    <th>Cantidad</th>
                </tr>
            </thead>
            <tbody id="inventoryTable">
                <!-- Aquí se llenarán los datos -->
            </tbody>
        </table>
        <p class="small-text">Actualizado automáticamente</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const username = localStorage.getItem("username") || "Desconocido";
        const userRef = ref(db, 'users/' + username);

        document.addEventListener("DOMContentLoaded", function() {
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const inventory = snapshot.val().inventory || {
                        "Carbón": 0,
                        "Cobre": 0,
                        "Hierro": 0,
                        "Plata": 0,
                        "Oro": 0
                    };

                    const inventoryTable = document.getElementById("inventoryTable");
                    for (const mineral in inventory) {
                        const row = document.createElement("tr");
                        const cell1 = document.createElement("td");
                        const cell2 = document.createElement("td");
                        
                        cell1.textContent = mineral;
                        cell2.textContent = inventory[mineral] || 0;
                        
                        row.appendChild(cell1);
                        row.appendChild(cell2);
                        inventoryTable.appendChild(row);
                    }
                }
            }).catch((error) => {
                console.error("Error al obtener el inventario: ", error);
            });
        });
    </script>

</body>
</html>
