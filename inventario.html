<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochila</title>
  <style>
    /* Estilos generales */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom right, #28a745, #f39c12);
      color: #333;
    }
    h1, h3 {
      text-align: center;
      color: #fff;
    }
    #mochila {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    p {
      font-size: 1.2em;
      margin: 10px 0;
      padding: 10px;
      background-color: #f1f1f1;
      border-radius: 4px;
    }
    p:nth-child(odd) {
      background-color: #e7e7e7;
    }
    h1 {
      font-size: 2em;
      color: #2c3e50;
      margin-top: 20px;
    }
    #inventario-title {
      font-size: 1.5em;
      color: #2980b9;
      margin-top: 20px;
      text-align: center;
    }
    #recursos-title {
      font-size: 1.4em;
      color: #16a085;
      text-align: center;
      margin-bottom: 20px;
    }
    #herramientas-title {
      font-size: 1.0em;
      color: #e67e22;
      text-align: center;
      margin-bottom: 20px;
    }
    .candado {
      font-size: 1.5em;
      color: #f39c12;
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
      authDomain: "thegame-5afaa.firebaseapp.com",
      databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
      projectId: "thegame-5afaa",
      storageBucket: "thegame-5afaa.firebasestorage.app",
      messagingSenderId: "588556182984",
      appId: "1:588556182984:web:a0557067d35c18e3944cfd",
      measurementId: "G-9M3CBJ3LV9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const username = localStorage.getItem("username") || "Desconocido";
    const userRef = ref(db, 'users/' + username);

    function mostrarInventario() {
      get(userRef).then((snapshot) => {
        if (snapshot.exists()) {
          const inventory = snapshot.val().inventory || {
            carbón: undefined,
            cobre: undefined,
            hierro: undefined,
            plata: undefined,
            oro: undefined,
            madera: undefined,
            arena: undefined,
            raíces: undefined,
            cuchillo: undefined,
            espada: undefined
          };

          // Porcentaje para cuchillo (100% por unidad)
          const porcentajeCuchillo = inventory.cuchillo !== undefined ? (inventory.cuchillo * 100) : 0;
          // Porcentaje para espada (150% por unidad)
          const porcentajeEspada = inventory.espada !== undefined ? (inventory.espada * 150) : 0;

          document.getElementById("carbón").textContent = inventory.carbón !== undefined ? "carbón: " + inventory.carbón : "carbón: 🔒";
          document.getElementById("cobre").textContent = inventory.cobre !== undefined ? "cobre: " + inventory.cobre : "cobre: 🔒";
          document.getElementById("hierro").textContent = inventory.hierro !== undefined ? "hierro: " + inventory.hierro : "hierro: 🔒";
          document.getElementById("plata").textContent = inventory.plata !== undefined ? "plata: " + inventory.plata : "plata: 🔒";
          document.getElementById("oro").textContent = inventory.oro !== undefined ? "oro: " + inventory.oro : "oro: 🔒";
          document.getElementById("madera").textContent = inventory.madera !== undefined ? "madera: " + inventory.madera : "madera: 🔒";
           document.getElementById("arena").textContent = inventory.madera !== undefined ? "arena: " + inventory.madera : "arena: 🔒";
           document.getElementById("raíces").textContent = inventory.madera !== undefined ? "raíces: " + inventory.madera : "raíces: 🔒";
          document.getElementById("cuchillo").textContent = inventory.cuchillo !== undefined ? "cuchillo: " + porcentajeCuchillo + "%" : "cuchillo: 🔒";
          document.getElementById("espada").textContent = inventory.espada !== undefined ? "espada: " + porcentajeEspada + "%" : "espada: 🔒";
        } else {
          console.log("No se encontraron datos para el usuario.");
        }
      }).catch((error) => {
        console.error("Error al obtener el inventario: ", error);
      });
    }

    document.addEventListener("DOMContentLoaded", function() {
      mostrarInventario();
    });
  </script>
</head>
<body>
  <h1>Mochila</h1>
  <h3 id="inventario-title">(inventario)</h3>
  <div id="mochila">
    <h3 id="recursos-title">Recursos</h3>
    <p id="carbón">carbón: 🔒</p>
    <p id="cobre">cobre: 🔒</p>
    <p id="hierro">hierro: 🔒</p>
    <p id="plata">plata: 🔒</p>
    <p id="oro">oro: 🔒</p>
    <p id="madera">madera: 🔒</p>
    <p id="arena">arena: 🔒</p>
    <p id="raíces">raíces: 🔒</p>
  </div>
  <div id="herramientas" style="background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 20px;">
    <h3 id="herramientas-title">Herramientas</h3>
    <p id="cuchillo">cuchillo: 🔒</p>
    <p id="espada">espada: 🔒</p>
  </div>
</body>
</html>
