<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Zanahorio Codderbone</title>
    <script type="module">
        // Importar Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, set, get, remove, onChildRemoved } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'chat');
        const cooldownRef = ref(db, 'cooldowns');  // Nuevo ref para gestionar los cooldowns

        // Obtener el nombre del usuario desde el almacenamiento local
        const username = localStorage.getItem("username") || "Desconocido";

        // Probabilidades de minerales
        const minerales = [
            { nombre: "Carbón", probabilidad: 70 },
            { nombre: "Hierro", probabilidad: 20 },
            { nombre: "Cobre", probabilidad: 5 },
            { nombre: "Plata", probabilidad: 3 },
            { nombre: "Oro", probabilidad: 2 }
        ];

        // Función para enviar mensajes
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("btnEnviar").addEventListener("click", function() {
                const mensaje = document.getElementById("inputMensaje").value.trim();
                if (mensaje !== "") {
                    push(chatRef, {
                        usuario: username,
                        texto: mensaje,
                        timestamp: Date.now()
                    });
                    document.getElementById("inputMensaje").value = "";
                }
            });
        });

        // Mostrar mensajes en tiempo real
        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            const mensajeElemento = document.createElement("div");
            mensajeElemento.textContent = `${data.usuario}: ${data.texto}`;
            mensajeElemento.classList.add("mensaje");
            document.getElementById("mensajes").appendChild(mensajeElemento);

            // Mantener solo los últimos 8 mensajes
            const mensajes = document.getElementById("mensajes").children;
            if (mensajes.length > 8) {
                document.getElementById("mensajes").removeChild(mensajes[0]);
            }
        });

        // Función para cargar el inventario
        function cargarInventario() {
            const materiales = [
                { nombre: "Carbón", cantidad: 0 },
                { nombre: "Cobre", cantidad: 0 },
                { nombre: "Hierro", cantidad: 0 },
                { nombre: "Plata", cantidad: 0 },
                { nombre: "Oro", cantidad: 0 }
            ];

            const contenedorInventario = document.getElementById('inventario');
            contenedorInventario.innerHTML = '';  // Limpiar contenido previo

            materiales.forEach((material) => {
                const articuloElemento = document.createElement("div");
                articuloElemento.classList.add("recuadro");
                articuloElemento.innerHTML = `
                    <p class="nombre">${material.nombre}</p>
                    <p class="cantidad">${material.cantidad}</p>
                `;
                contenedorInventario.appendChild(articuloElemento);
            });
        }

        // Función para realizar la minería
        function realizarMineria() {
            const usuarioCooldownRef = ref(cooldownRef, username);
            get(usuarioCooldownRef).then((snapshot) => {
                const lastMineTime = snapshot.val() || 0;
                const currentTime = Date.now();
                const cooldownTime = 5 * 60 * 1000; // 5 minutos en milisegundos

                if (currentTime - lastMineTime < cooldownTime) {
                    alert("Debes esperar 5 minutos para minar de nuevo.");
                } else {
                    // Generar mineral aleatorio según probabilidades
                    const totalProbabilidad = minerales.reduce((acc, min) => acc + min.probabilidad, 0);
                    const aleatorio = Math.random() * totalProbabilidad;

                    let acumulado = 0;
                    let mineralEncontrado = null;
                    for (let i = 0; i < minerales.length; i++) {
                        acumulado += minerales[i].probabilidad;
                        if (aleatorio <= acumulado) {
                            mineralEncontrado = minerales[i].nombre;
                            break;
                        }
                    }

                    // Actualizar la base de datos para agregar el mineral al inventario
                    const inventarioRef = ref(db, 'inventario/' + username);
                    get(inventarioRef).then((inventarioSnapshot) => {
                        const inventario = inventarioSnapshot.val() || {};
                        inventario[mineralEncontrado] = (inventario[mineralEncontrado] || 0) + 1;

                        // Guardar el mineral encontrado en el inventario
                        set(inventarioRef, inventario);

                        // Actualizar el tiempo del cooldown
                        set(usuarioCooldownRef, currentTime);

                        alert(`¡Has encontrado 1 unidad de ${mineralEncontrado}!`);
                    });
                }
            });
        }

        // Añadir la funcionalidad del comando /mine
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("btnMine").addEventListener("click", function() {
                realizarMineria();
            });
        });

        // Llamar a la función para cargar el inventario al cargar la página
        document.addEventListener("DOMContentLoaded", cargarInventario);

    </script>
    <style>
        /* Agrega tus estilos aquí */
        /* Los mismos que el código original */
    </style>
</head>
<body>
    <div id="titulo">Zanahorio Codderbone</div>
    <div id="mensajes"></div>
    <div id="entrada">
        <input type="text" id="inputMensaje" placeholder="Escribe un mensaje...">
        <button id="btnEnviar">Enviar</button>
    </div>

    <!-- Botón para ejecutar la minería -->
    <button id="btnMine">Realizar minería</button>

    <!-- Contenedor para mostrar el inventario -->
    <div id="inventario"></div>

    <!-- Enlace al bot -->
    <script src="https://zanahorio326.github.io/Mal-comienzo/bot.js" defer></script>

</body>
</html>
