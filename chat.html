<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Zanahorio Codderbone</title>
    <script type="module">
        // Importar Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, set, get, remove } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'chat');
        const inventarioRef = ref(db, 'inventario');

        // Obtener el nombre del usuario desde el almacenamiento local
        const username = localStorage.getItem("username") || "Desconocido";

        // Función para enviar mensajes
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("btnEnviar").addEventListener("click", function() {
                const mensaje = document.getElementById("inputMensaje").value.trim();
                if (mensaje !== "") {
                    push(chatRef, {
                        usuario: username,
                        texto: mensaje,
                        timestamp: Date.now()
                    });
                    document.getElementById("inputMensaje").value = "";
                }
            });

            // Cargar inventario del usuario
            cargarInventario();
        });

        // Función para cargar el inventario del usuario
        function cargarInventario() {
            get(ref(db, 'inventario/' + username)).then(snapshot => {
                const inventario = snapshot.val();
                if (inventario) {
                    mostrarInventario(inventario);
                } else {
                    // Si no existe inventario, creamos uno vacío
                    set(ref(db, 'inventario/' + username), []);
                    mostrarInventario([]);
                }
            }).catch(error => console.error('Error al cargar inventario:', error));
        }

        // Función para mostrar el inventario en la página
        function mostrarInventario(inventario) {
            const contenedorInventario = document.getElementById("inventario");
            contenedorInventario.innerHTML = "<h3>Inventario de " + username + "</h3>";
            inventario.forEach(item => {
                const itemElemento = document.createElement("div");
                itemElemento.textContent = item;
                itemElemento.classList.add("item");
                contenedorInventario.appendChild(itemElemento);
            });
        }

        // Función para mostrar mensajes en tiempo real
        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            const mensajeElemento = document.createElement("div");
            mensajeElemento.textContent = `${data.usuario}: ${data.texto}`;
            mensajeElemento.classList.add("mensaje");
            document.getElementById("mensajes").appendChild(mensajeElemento);

            // Mantener solo los últimos 6 mensajes
            const mensajes = document.getElementById("mensajes").children;
            if (mensajes.length > 6) {
                document.getElementById("mensajes").removeChild(mensajes[0]);
            }
        });

        // Función para cargar teórico.html de manera modular
        function cargarTeorico() {
            fetch('https://zanahorio326.github.io/Mal-comienzo/teorico.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('contenedorTeorico').innerHTML = data;
                })
                .catch(error => console.error('Error al cargar teórico.html:', error));
        }

        // Llamar a la función para cargar teórico.html
        document.addEventListener("DOMContentLoaded", cargarTeorico);

    </script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100dvh; /* Usa altura real del dispositivo */
            margin: 0;
            padding: 10px; /* Margen para que el contenido no toque los bordes */
            background: linear-gradient(to bottom, #ff7f00, #008f39);
            color: white;
        }

        #titulo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        #mensajes {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-height: calc(100dvh - 120px); /* Ajuste dinámico según el tamaño del dispositivo */
            margin-top: 5px; /* Reducción del margen superior */
        }

        .mensaje {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            width: fit-content;
        }

        #entrada {
            display: flex;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        #inputMensaje {
            flex-grow: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        #btnEnviar {
            padding: 8px 15px;
            margin-left: 10px;
            border: none;
            border-radius: 5px;
            background: #ffcc00;
            cursor: pointer;
            font-size: 16px;
        }

        /* Ajuste responsivo */
        @media (max-width: 600px) {
            #titulo {
                font-size: 20px;
            }

            #inputMensaje {
                font-size: 14px;
            }

            #btnEnviar {
                font-size: 14px;
            }
        }

        #contenedorTeorico {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 10px;
            overflow-y: auto;
            max-height: 400px; /* Limita la altura */
        }

        #inventario {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .item {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="titulo">Zanahorio Codderbone</div>
    <div id="mensajes"></div>
    <div id="entrada">
        <input type="text" id="inputMensaje" placeholder="Escribe un mensaje...">
        <button id="btnEnviar">Enviar</button>
    </div>

    <!-- Contenedor para cargar teórico.html -->
    <div id="contenedorTeorico"></div>

    <!-- Contenedor para el inventario -->
    <div id="inventario"></div>

</body>
</html>
