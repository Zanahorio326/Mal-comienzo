<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
      authDomain: "thegame-5afaa.firebaseapp.com",
      databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
      projectId: "thegame-5afaa",
      storageBucket: "thegame-5afaa.firebasestorage.app",
      messagingSenderId: "588556182984",
      appId: "1:588556182984:web:a0557067d35c18e3944cfd",
      measurementId: "G-9M3CBJ3LV9"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const firestore = firebase.firestore();

    // Verificar si el usuario está autenticado
    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "https://zanahorio326.github.io/Mal-comienzo/login.html";
      } else {
        // Obtener el nombre de usuario de Firestore
        firestore.collection("users").doc(user.uid).get()
          .then((doc) => {
            const username = doc.data().username;
            document.getElementById("welcomeMessage").innerText = "Bienvenido, " + username;
          });
      }
    });

    // Función para enviar un mensaje
    function sendMessage() {
      const message = document.getElementById("message").value;
      const user = auth.currentUser;

      if (message) {
        firestore.collection("chats").add({
          username: user.displayName,
          message: message,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById("message").value = "";
      }
    }
  </script>
</head>
<body>
  <h2 id="welcomeMessage">Cargando...</h2>
  <div id="chatbox">
    <!-- Aquí se mostrarán los mensajes -->
  </div>
  <textarea id="message" placeholder="Escribe tu mensaje..."></textarea>
  <button onclick="sendMessage()">Enviar</button>
  <button onclick="auth.signOut()">Cerrar sesión</button>
</body>
</html>
