<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Zanahorio Codderbone</title>
    <script type="module">
        // Importar Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'chat');

        // Obtener el nombre del usuario desde el almacenamiento local
        const username = localStorage.getItem("username") || "Desconocido";

        // Función para enviar mensajes
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("btnEnviar").addEventListener("click", function() {
                const mensaje = document.getElementById("inputMensaje").value.trim();
                if (mensaje !== "") {
                    push(chatRef, {
                        usuario: username,
                        texto: mensaje,
                        timestamp: Date.now()
                    });
                    document.getElementById("inputMensaje").value = "";
                }
            });
        });

        // Mostrar mensajes en tiempo real
        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            const mensajeElemento = document.createElement("div");
            mensajeElemento.textContent = `${data.usuario}: ${data.texto}`;
            mensajeElemento.classList.add("mensaje");
            document.getElementById("mensajes").appendChild(mensajeElemento);

            // Mantener solo los últimos 6 mensajes
            const mensajes = document.getElementById("mensajes").children;
            if (mensajes.length > 6) {
                document.getElementById("mensajes").removeChild(mensajes[0]);
            }

            // Auto-scroll al último mensaje
            document.getElementById("mensajes").scrollTop = document.getElementById("mensajes").scrollHeight;
        });

    </script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #ff7f00, #008f39);
            color: white;
            overflow: hidden;
        }

        #titulo {
            text-align: center;
            font-size: 5vw;
            font-weight: bold;
            margin-top: 10px;
            max-width: 90%;
            text-wrap: balance;
        }

        #mensajes {
            flex-grow: 1;
            width: 90%;
            max-width: 600px;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            height: 60vh;
            max-height: 60vh;
        }

        .mensaje {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            width: fit-content;
            max-width: 80%;
            word-wrap: break-word;
        }

        #entrada {
            display: flex;
            width: 90%;
            max-width: 600px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        #inputMensaje {
            flex-grow: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            width: 100%;
        }

        #btnEnviar {
            padding: 8px 15px;
            margin-left: 10px;
            border: none;
            border-radius: 5px;
            background: #ffcc00;
            cursor: pointer;
            font-size: 16px;
            white-space: nowrap;
        }

        /* Ajustes responsivos */
        @media (max-width: 768px) {
            #titulo {
                font-size: 6vw;
            }

            #mensajes {
                width: 95%;
                height: 65vh;
                max-height: 65vh;
            }

            #entrada {
                width: 95%;
            }

            #btnEnviar {
                font-size: 14px;
                padding: 8px;
            }
        }

        @media (max-width: 480px) {
            #titulo {
                font-size: 7vw;
            }

            #mensajes {
                height: 60vh;
                max-height: 60vh;
            }

            #entrada {
                flex-direction: column;
                align-items: center;
                gap: 5px;
            }

            #btnEnviar {
                width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div id="titulo">Zanahorio Codderbone</div>
    <div id="mensajes"></div>
    <div id="entrada">
        <input type="text" id="inputMensaje" placeholder="Escribe un mensaje...">
        <button id="btnEnviar">Enviar</button>
    </div>
</body>
</html>
