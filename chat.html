<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
      authDomain: "thegame-5afaa.firebaseapp.com",
      databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
      projectId: "thegame-5afaa",
      storageBucket: "thegame-5afaa.firebasestorage.app",
      messagingSenderId: "588556182984",
      appId: "1:588556182984:web:a0557067d35c18e3944cfd",
      measurementId: "G-9M3CBJ3LV9"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const firestore = firebase.firestore();

    // Verificar si el usuario está autenticado
    auth.onAuthStateChanged((user) => {
      if (!user) {
        // Si no está autenticado, redirigir al inicio de sesión
        window.location.href = "https://zanahorio326.github.io/Mal-comienzo/index.html";
      } else {
        // Obtener el nombre de usuario desde Firestore y mostrarlo
        firestore.collection("users").doc(user.uid).get().then((doc) => {
          document.getElementById("userName").textContent = doc.data().username;
        });
      }
    });

    // Enviar un mensaje
    function sendMessage() {
      const message = document.getElementById("message").value;
      const user = auth.currentUser;
      if (message && user) {
        firestore.collection("messages").add({
          user: user.email.split('@')[0],
          message: message,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById("message").value = "";
      }
    }

    // Obtener y mostrar los mensajes
    function getMessages() {
      firestore.collection("messages")
        .orderBy("timestamp")
        .onSnapshot((snapshot) => {
          const messages = snapshot.docs.map(doc => doc.data());
          const messagesContainer = document.getElementById("messagesContainer");
          messagesContainer.innerHTML = "";
          messages.forEach(msg => {
            const msgElement = document.createElement("p");
            msgElement.textContent = `${msg.user}: ${msg.message}`;
            messagesContainer.appendChild(msgElement);
          });
        });
    }

    // Cargar los mensajes cuando la página se carga
    window.onload = getMessages;
  </script>
</head>
<body>
  <h2>Bienvenido, <span id="userName"></span></h2>
  <div id="messagesContainer"></div>

  <input type="text" id="message" placeholder="Escribe un mensaje...">
  <button onclick="sendMessage()">Enviar</button>

  <button onclick="auth.signOut()">Cerrar sesión</button>
</body>
</html>
