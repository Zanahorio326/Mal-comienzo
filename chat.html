<body>  
    <div id="titulo">Zanahorio Codderbone</div>  
    <div id="mensajes"></div>  
    <div id="entrada">  
        <input type="text" id="inputMensaje" placeholder="Escribe un mensaje...">  
        <button id="btnEnviar">Enviar</button>  
    </div>  

    <!-- Botón para alternar entre Inventario y Comandos -->
    <button id="btnMochila">Mochila</button>

    <!-- Contenedor donde se alternará Inventario y Comandos -->
    <div id="contenedorMochila"></div>  

    <script type="module">  
        // Importar Firebase  
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";  
        import { getDatabase, ref, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";  

        // Configuración de Firebase  
        const firebaseConfig = {  
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",  
            authDomain: "thegame-5afaa.firebaseapp.com",  
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",  
            projectId: "thegame-5afaa",  
            storageBucket: "thegame-5afaa.firebasestorage.app",  
            messagingSenderId: "588556182984",  
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",  
            measurementId: "G-9M3CBJ3LV9"  
        };  

        // Inicializar Firebase  
        const app = initializeApp(firebaseConfig);  
        const db = getDatabase(app);  
        const chatRef = ref(db, 'chat');  

        const username = localStorage.getItem("username") || "Desconocido";  

        document.addEventListener("DOMContentLoaded", function() {  
            document.getElementById("btnEnviar").addEventListener("click", function() {  
                const mensaje = document.getElementById("inputMensaje").value.trim();  
                if (mensaje !== "") {  
                    push(chatRef, { usuario: username, texto: mensaje, timestamp: Date.now() });  
                    document.getElementById("inputMensaje").value = "";  
                }  
            });  
        });  

        onChildAdded(chatRef, (snapshot) => {  
            const data = snapshot.val();  
            const mensajeElemento = document.createElement("div");  
            mensajeElemento.textContent = `${data.usuario}: ${data.texto}`;  
            mensajeElemento.classList.add("mensaje");  
            document.getElementById("mensajes").appendChild(mensajeElemento);  

            const mensajes = document.getElementById("mensajes").children;  
            if (mensajes.length > 8) {  
                document.getElementById("mensajes").removeChild(mensajes[0]);  
                remove(ref(db, 'chat/' + snapshot.key));  
            }  
        });  

        function cargarInventario() {  
            const materiales = [
                { nombre: "Carbón", cantidad: 0 },  
                { nombre: "Cobre", cantidad: 0 },  
                { nombre: "Hierro", cantidad: 0 },  
                { nombre: "Plata", cantidad: 0 },  
                { nombre: "Oro", cantidad: 0 }  
            ];  

            const contenedorMochila = document.getElementById('contenedorMochila');  
            contenedorMochila.innerHTML = '';  

            materiales.forEach((material) => {  
                const articuloElemento = document.createElement("div");  
                articuloElemento.classList.add("recuadro");  
                articuloElemento.innerHTML = `  
                    <p class="nombre">${material.nombre}</p>  
                    <p class="cantidad">${material.cantidad}</p>  
                `;  
                contenedorMochila.appendChild(articuloElemento);  
            });  
        }  

        function cargarComandos() {
            const comandos = ["Usar", "Descartar", "Inspeccionar"];
            const contenedorMochila = document.getElementById('contenedorMochila');  
            contenedorMochila.innerHTML = '';

            comandos.forEach((comando) => {
                const boton = document.createElement("button");
                boton.textContent = comando;
                boton.classList.add("boton-comando");
                boton.addEventListener("click", () => {
                    alert(`Comando seleccionado: ${comando}`);
                });
                contenedorMochila.appendChild(boton);
            });
        }

        let mostrandoInventario = true;  

        function alternarMochila() {
            mostrandoInventario = !mostrandoInventario;  
            if (mostrandoInventario) {  
                cargarInventario();  
            } else {  
                cargarComandos();  
            }  
        }  

        document.getElementById("btnMochila").addEventListener("click", alternarMochila);  

        document.addEventListener("DOMContentLoaded", cargarInventario);  

    </script>  

    <style>  
        * { box-sizing: border-box; }  

        body {  
            font-family: Arial, sans-serif;  
            display: flex;  
            flex-direction: column;  
            justify-content: space-between;  
            height: 100dvh;  
            margin: 0;  
            padding: 10px;  
            background: linear-gradient(to bottom, #ff7f00, #008f39);  
            color: white;  
        }  

        #btnMochila {  
            margin-top: 10px;  
            padding: 10px;  
            border: none;  
            border-radius: 5px;  
            background: #ffcc00;  
            cursor: pointer;  
            font-size: 16px;  
            width: 100%;  
        }  

        #contenedorMochila {  
            margin-top: 10px;  
            background: rgba(0, 0, 0, 0.2);  
            padding: 10px;  
            border-radius: 10px;  
            overflow-y: auto;  
            max-height: 400px;  
        }  

        .recuadro {  
            display: flex;  
            justify-content: space-between;  
            background-color: rgba(255, 255, 255, 0.2);  
            border-radius: 5px;  
            padding: 8px;  
            margin-bottom: 5px;  
        }  

        .boton-comando {  
            display: block;  
            width: 100%;  
            margin: 5px 0;  
            padding: 10px;  
            border: none;  
            border-radius: 5px;  
            background: #ffcc00;  
            cursor: pointer;  
            font-size: 16px;  
        }  
    </style>  
</body>
