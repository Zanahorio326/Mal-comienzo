<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Tiempo Real</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            align-items: center;
            background-color: #fff;
            padding: 2%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 800px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 1px;
            background-color: #ddd;
            border: 1px solid #ddd;
            width: 100%;
            height: 50vh;
        }
        .grid-item {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(12px, 2vw, 16px);
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="grid" id="grid-container">
            <!-- Aquí se llenarán las celdas del inventario -->
        </div>
    </div>

    <script>
        // Función para obtener el inventario del almacenamiento local y actualizarlo
        function actualizarInventario() {
            const inventario = JSON.parse(localStorage.getItem("inventarioMinerales"));
            const gridContainer = document.getElementById('grid-container');

            // Limpiar la cuadrícula antes de actualizar
            gridContainer.innerHTML = '';

            // Llenar la cuadrícula con los datos del inventario
            if (inventario) {
                inventario.forEach(item => {
                    gridContainer.innerHTML += `
                        <div class="grid-item">${item.nombre}</div>
                        <div class="grid-item">${item.cantidad}</div>
                    `;
                });
            }
        }

        // Actualizar el inventario cada segundo (recomendable para tiempo real)
        setInterval(actualizarInventario, 1000);

        // Inicialización: Si no existe inventario en localStorage, lo crea
        if (!localStorage.getItem("inventarioMinerales")) {
            const inventarioInicial = [
                { nombre: "Piedra caliza", cantidad: 0 },
                { nombre: "Carbón", cantidad: 0 },
                { nombre: "Hierro", cantidad: 0 },
                { nombre: "Cobre", cantidad: 0 },
                { nombre: "Estaño", cantidad: 0 },
                { nombre: "Plata", cantidad: 0 }
            ];
            localStorage.setItem("inventarioMinerales", JSON.stringify(inventarioInicial));
        }

        // Llamar a la función para actualizar la cuadrícula en cuanto cargue
        actualizarInventario();
    </script>
</body>
</html>
