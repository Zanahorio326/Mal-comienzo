<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Zanahorio Codderbone</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'chat');

        const username = localStorage.getItem("username") || "Desconocido";

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("btnEnviar").addEventListener("click", function() {
                const mensaje = document.getElementById("inputMensaje").value.trim();
                if (mensaje !== "") {
                    push(chatRef, {
                        usuario: username,
                        texto: mensaje,
                        timestamp: Date.now()
                    });
                    document.getElementById("inputMensaje").value = "";
                }
            });

            document.getElementById("btnMochila").addEventListener("click", function() {
                const inventario = document.getElementById("inventario");
                inventario.classList.toggle("mostrar");
            });

            document.getElementById("btnHerramientas").addEventListener("click", function() {
                const herramientas = document.getElementById("herramientas");
                herramientas.classList.toggle("mostrar");
            });
        });

        // Cargar mensajes en tiempo real
        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            const mensajeElemento = document.createElement("div");
            mensajeElemento.textContent = `${data.usuario}: ${data.texto}`;
            mensajeElemento.classList.add("mensaje");
            document.getElementById("mensajes").appendChild(mensajeElemento);

            // Desplazar hacia el último mensaje
            const mensajes = document.getElementById("mensajes");
            mensajes.scrollTop = mensajes.scrollHeight;

            // Limitar la cantidad de mensajes visibles
            const mensajeLimite = 8;
            const mensajesHijos = mensajes.children;
            if (mensajesHijos.length > mensajeLimite) {
                mensajes.removeChild(mensajesHijos[0]);
                remove(ref(db, 'chat/' + snapshot.key));
            }
        });

        function cargarInventario() {
            const materiales = [
                { nombre: "Carbón", cantidad: 0 },
                { nombre: "Cobre", cantidad: 0 },
                { nombre: "Hierro", cantidad: 0 },
                { nombre: "Plata", cantidad: 0 },
                { nombre: "Oro", cantidad: 0 }
            ];

            const contenedorInventario = document.getElementById('inventario');
            contenedorInventario.innerHTML = '';

            materiales.forEach((material) => {
                const articuloElemento = document.createElement("div");
                articuloElemento.classList.add("recuadro");
                articuloElemento.innerHTML = `
                    <p class="nombre">${material.nombre}</p>
                    <p class="cantidad">${material.cantidad}</p>
                `;
                contenedorInventario.appendChild(articuloElemento);
            });
        }

        document.addEventListener("DOMContentLoaded", cargarInventario);
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100dvh;
            background: linear-gradient(to bottom, #ff7f00, #008f39);
            color: white;
            padding: 10px;
            overflow: hidden;
        }

        #titulo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #mensajes {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            width: 100%;
            max-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .mensaje {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            width: fit-content;
        }

        #entrada {
            display: flex;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            position: relative;
        }

        #inputMensaje {
            flex-grow: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        #btnEnviar {
            padding: 8px 15px;
            margin-left: 10px;
            border: none;
            border-radius: 5px;
            background: #ffcc00;
            cursor: pointer;
            font-size: 16px;
        }

        #btnMochila {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #008f39;
            color: white;
            padding: 10px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        #btnHerramientas {
            position: fixed;
            top: 10px;
            left: 10px;
            background: #ffcc00;
            color: white;
            padding: 10px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        #inventario {
            position: fixed;
            top: 50px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 10px;
            max-height: 50vh;
            overflow-y: auto;
            display: none;
            width: 200px;
        }

        #inventario.mostrar {
            display: block;
        }

        #herramientas {
            position: fixed;
            top: 50px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 10px;
            max-height: 50vh;
            overflow-y: auto;
            display: none;
            width: 200px;
        }

        #herramientas.mostrar {
            display: block;
        }

        .recuadro {
            display: flex;
            justify-content: space-between;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            padding: 8px;
            margin-bottom: 5px;
        }

        .nombre {
            font-weight: bold;
        }

        .cantidad {
            color: #4CAF50;
        }

        @media (max-width: 600px) {
            #titulo {
                font-size: 20px;
            }

            #inputMensaje {
                font-size: 14px;
            }

            #btnEnviar {
                font-size: 14px;
            }

            #btnMochila {
                top: 15px;
                right: 15px;
            }

            #btnHerramientas {
                top: 15px;
                left: 15px;
            }

            #inventario {
                width: 180px;
                top: 55px;
            }

            #herramientas {
                width: 180px;
                top: 55px;
            }
        }
    </style>
</head>
<body>
    <div id="titulo">Zanahorio Codderbone</div>
    <div id="mensajes"></div>
    <div id="entrada">
        <input type="text" id="inputMensaje" placeholder="Escribe un mensaje...">
        <button id="btnEnviar">Enviar</button>
    </div>
    <button id="btnMochila">🎒</button>
    <button id="btnHerramientas">⛏️</button>
    <div id="inventario"></div>
    <div id="herramientas">
        <iframe src="https://zanahorio326.github.io/Mal-comienzo/chat.js" style="width: 100%; height: 400px; border: none;"></iframe>
    </div>
</body>
</html>
