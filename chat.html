<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Tiempo Real</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .chat-container {
            width: 90%;
            max-width: 800px;
            background-color: #fff;
            padding: 2%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .chat-box {
            height: 400px;
            overflow-y: scroll;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .input-box {
            display: flex;
            justify-content: space-between;
        }
        .input-box input {
            width: 85%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .input-box button {
            padding: 10px 15px;
            background-color: #008CBA;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .input-box button:hover {
            background-color: #007B9E;
        }

        /* Estilos para el inventario */
        .inventory-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 1px;
            background-color: #ddd;
            border: 1px solid #ddd;
            width: 100%;
            max-width: 300px;
            margin-top: 10px;
        }
        .inventory-item {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            border: 1px solid #ccc;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <!-- Aquí aparecerán los mensajes del chat -->
        </div>

        <div class="input-box">
            <input type="text" id="user-message" placeholder="Escribe un mensaje..." />
            <button onclick="sendMessage()">Enviar</button>
        </div>

        <!-- Contenedor del Inventario -->
        <div class="inventory-container">
            <h3>Inventario de Minerales</h3>
            <div class="inventory-grid" id="inventory-grid">
                <!-- El inventario se llenará aquí -->
            </div>
        </div>
    </div>

    <script>
        // Inicialización de inventario en localStorage si no existe
        if (!localStorage.getItem("inventarioMinerales")) {
            const inventarioInicial = [
                { nombre: "Piedra caliza", cantidad: 0 },
                { nombre: "Carbón", cantidad: 0 },
                { nombre: "Hierro", cantidad: 0 },
                { nombre: "Cobre", cantidad: 0 },
                { nombre: "Estaño", cantidad: 0 },
                { nombre: "Plata", cantidad: 0 }
            ];
            localStorage.setItem("inventarioMinerales", JSON.stringify(inventarioInicial));
        }

        // Función para actualizar el inventario en la interfaz
        function actualizarInventario() {
            const inventario = JSON.parse(localStorage.getItem("inventarioMinerales"));
            const inventoryGrid = document.getElementById('inventory-grid');
            inventoryGrid.innerHTML = '';  // Limpiar inventario actual

            // Agregar los items del inventario a la cuadrícula
            inventario.forEach(item => {
                inventoryGrid.innerHTML += `
                    <div class="inventory-item">${item.nombre}</div>
                    <div class="inventory-item">${item.cantidad}</div>
                `;
            });
        }

        // Actualizar inventario cada segundo
        setInterval(actualizarInventario, 1000);

        // Función para enviar mensaje en el chat
        function sendMessage() {
            const messageInput = document.getElementById('user-message');
            const message = messageInput.value;

            if (message.trim()) {
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML += `<div>${message}</div>`;
                messageInput.value = '';  // Limpiar el campo de texto después de enviar
                chatBox.scrollTop = chatBox.scrollHeight;  // Hacer scroll hacia el fondo
            }
        }

        // Inicializar la visualización del inventario
        actualizarInventario();
    </script>
</body>
</html>
