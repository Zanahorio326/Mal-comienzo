<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, remove, get, child } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
  authDomain: "thegame-5afaa.firebaseapp.com",
  databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
  projectId: "thegame-5afaa",
  storageBucket: "thegame-5afaa.firebasestorage.app",
  messagingSenderId: "588556182984",
  appId: "1:588556182984:web:a0557067d35c18e3944cfd",
  measurementId: "G-9M3CBJ3LV9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const inventarioRef = ref(db, 'inventarios');  // Ruta del inventario en Firebase
const chatRef = ref(db, 'chat');

const username = localStorage.getItem("username") || "Desconocido";

document.addEventListener("DOMContentLoaded", function() {

  // Enviar mensaje
  document.getElementById("btnEnviar").addEventListener("click", function() {
    const mensaje = document.getElementById("inputMensaje").value.trim();
    if (mensaje !== "") {
      push(chatRef, {
        usuario: username,
        texto: mensaje,
        timestamp: Date.now()
      });
      document.getElementById("inputMensaje").value = "";
    }
  });

  // Mostrar inventario
  document.getElementById("btnMochila").addEventListener("click", function() {
    const inventario = document.getElementById("inventario");
    inventario.classList.toggle("mostrar");
  });

  // Mostrar herramientas
  document.getElementById("btnHerramientas").addEventListener("click", function() {
    const herramientas = document.getElementById("herramientas");
    herramientas.classList.toggle("mostrar");
    cargarTeorico();
  });

  // Cargar el inventario desde Firebase
  cargarInventario();
});

// Cargar mensajes en tiempo real
onChildAdded(chatRef, (snapshot) => {
  const data = snapshot.val();
  const mensajeElemento = document.createElement("div");
  mensajeElemento.textContent = `${data.usuario}: ${data.texto}`;
  mensajeElemento.classList.add("mensaje");
  document.getElementById("mensajes").appendChild(mensajeElemento);

  // Desplazar hacia el último mensaje
  const mensajes = document.getElementById("mensajes");
  mensajes.scrollTop = mensajes.scrollHeight;

  // Limitar la cantidad de mensajes visibles y eliminar el mensaje más antiguo
  const mensajeLimite = 8;
  const mensajesHijos = mensajes.children;
  if (mensajesHijos.length > mensajeLimite) {
    mensajes.removeChild(mensajesHijos[0]);
  }
});

// Cargar inventario desde Firebase
function cargarInventario() {
  const usuarioID = localStorage.getItem("username") || "Desconocido"; // Obtener el username del usuario

  get(child(inventarioRef, usuarioID)).then((snapshot) => {
    if (snapshot.exists()) {
      const inventarioData = snapshot.val();
      const materiales = [
        { nombre: "Carbón", cantidad: inventarioData.Carbón || 0 },
        { nombre: "Cobre", cantidad: inventarioData.Cobre || 0 },
        { nombre: "Hierro", cantidad: inventarioData.Hierro || 0 },
        { nombre: "Plata", cantidad: inventarioData.Plata || 0 },
        { nombre: "Oro", cantidad: inventarioData.Oro || 0 }
      ];

      const contenedorInventario = document.getElementById('inventario');
      contenedorInventario.innerHTML = '';

      materiales.forEach((material) => {
        const articuloElemento = document.createElement("div");
        articuloElemento.classList.add("recuadro");
        articuloElemento.innerHTML = `
          <p class="nombre">${material.nombre}</p>
          <p class="cantidad">${material.cantidad}</p>
        `;
        contenedorInventario.appendChild(articuloElemento);
      });
    } else {
      console.log("No hay datos de inventario para este usuario.");
    }
  }).catch((error) => {
    console.error("Error al cargar el inventario:", error);
  });
}

// Función para cargar la página teorico.html dentro del contenedor
function cargarTeorico() {
  const herramientasContenedor = document.getElementById("herramientas");
  herramientasContenedor.innerHTML = `
    <iframe src="https://zanahorio326.github.io/Mal-comienzo/teorico.html" width="100%" height="400" frameborder="0"></iframe>
  `;
  // Incrustar la página de inventario.html dentro de la mochila
  const mochilaContenedor = document.getElementById("inventario");
  mochilaContenedor.innerHTML = `
    <iframe src="https://zanahorio326.github.io/Mal-comienzo/inventario.html" width="100%" height="400" frameborder="0"></iframe>
  `;
}

</script>
