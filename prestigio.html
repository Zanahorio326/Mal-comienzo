<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Prestigio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #4caf50, #ff9800);
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        h1 {
            margin-bottom: 20px;
        }
        
        table {
            width: 60%;
            margin: 0 auto;
            border-collapse: collapse;
        }
        
        table, th, td {
            border: 1px solid #fff;
        }
        
        th, td {
            padding: 10px;
            text-align: center;
        }
        
        th {
            background-color: #333;
        }

        tr:nth-child(even) {
            background-color: #444;
        }

        tr:nth-child(odd) {
            background-color: #555;
        }

        /* Animación de despliegue de fila */
        .fila {
            opacity: 0;
            animation: desplegarFila 0.5s ease-out forwards;
        }

        @keyframes desplegarFila {
            0% {
                transform: translateY(-20px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Animación de aumento de prestigio */
        .prestigio {
            font-weight: bold;
            color: #4CAF50;
            font-size: 1.2em;
            animation: aumentoPrestigio 2s ease-in-out forwards;
        }

        @keyframes aumentoPrestigio {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>Tabla de Prestigio</h1>
    <table>
        <thead>
            <tr>
                <th>Nombre de Usuario</th>
                <th>Prestigio</th>
            </tr>
        </thead>
        <tbody id="tablaPrestigio">
            <!-- Aquí se cargarán los datos de los usuarios -->
        </tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicialización de Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Función para calcular el prestigio
        function calcularPrestigio(inventory) {
            const puntosPorMineral = {
                "Carbón": 1,
                "Cobre": 2,
                "Hierro": 5,
                "Plata": 10,
                "Oro": 20
            };

            let prestigio = 0;
            for (const mineral in inventory) {
                prestigio += inventory[mineral] * (puntosPorMineral[mineral] || 0);
            }
            return prestigio;
        }

        // Función para animar el prestigio
        function animarPrestigio(id, valorFinal) {
            let valorActual = 0;
            let incremento = valorFinal / 100; // Ajusta la velocidad de la animación
            let intervalo = setInterval(function() {
                valorActual += incremento;
                document.getElementById(id).textContent = Math.floor(valorActual);
                if (valorActual >= valorFinal) {
                    clearInterval(intervalo);
                }
            }, 20);
        }

        // Función para mostrar la tabla de prestigio
        function mostrarPrestigio() {
            const tablaPrestigio = document.getElementById("tablaPrestigio");
            const usersRef = ref(db, 'users/');

            get(usersRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const usuarios = snapshot.val();
                    const usuariosArray = [];

                    for (const username in usuarios) {
                        const inventory = usuarios[username].inventory || {
                            Carbón: 0,
                            Cobre: 0,
                            Hierro: 0,
                            Plata: 0,
                            Oro: 0
                        };

                        const prestigio = calcularPrestigio(inventory);
                        usuariosArray.push({ username, prestigio });
                    }

                    // Ordenar los usuarios por prestigio (de mayor a menor)
                    usuariosArray.sort((a, b) => b.prestigio - a.prestigio);

                    // Limpiar la tabla actual
                    tablaPrestigio.innerHTML = '';

                    // Agregar las filas ordenadas con animación de despliegue
                    usuariosArray.forEach((usuario, index) => {
                        const fila = document.createElement("tr");
                        fila.classList.add("fila");

                        const celdaNombre = document.createElement("td");
                        celdaNombre.textContent = usuario.username;
                        fila.appendChild(celdaNombre);

                        const celdaPrestigio = document.createElement("td");
                        const prestigioSpan = document.createElement("span");
                        prestigioSpan.classList.add("prestigio");
                        prestigioSpan.id = `prestigio${index}`;
                        prestigioSpan.textContent = "0"; // Inicializa el prestigio en 0
                        celdaPrestigio.appendChild(prestigioSpan);
                        fila.appendChild(celdaPrestigio);

                        tablaPrestigio.appendChild(fila);

                        // Animar el prestigio
                        animarPrestigio(`prestigio${index}`, usuario.prestigio);
                    });
                } else {
                    console.log("No se encontraron datos para los usuarios.");
                }
            }).catch((error) => {
                console.error("Error al obtener los datos de los usuarios: ", error);
            });
        }

        // Cargar la tabla de prestigio al cargar la página
        document.addEventListener("DOMContentLoaded", mostrarPrestigio);
    </script>
</body>
</html>
