<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Prestigio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #4caf50, #ff9800);
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            width: 60%;
            margin: 0 auto;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid #fff;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #333;
        }

        tr:nth-child(even) {
            background-color: #444;
        }

        tr:nth-child(odd) {
            background-color: #555;
        }

        /* Animación de aparición de filas */
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Estilo para el botón animado */
        .boton {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            background-size: 200% 200%;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            animation: gradiente 2s ease infinite;
            margin-top: 30px;
        }

        .boton:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        @keyframes gradiente {
            0% {
                background-position: 200% 0;
            }
            50% {
                background-position: 0 100%;
            }
            100% {
                background-position: 200% 0;
            }
        }
    </style>
</head>
<body>
    <h1>Tabla de Prestigio</h1>
    <table>
        <thead>
            <tr>
                <th>Nombre de Usuario</th>
                <th>Prestigio</th>
            </tr>
        </thead>
        <tbody id="tablaPrestigio">
            <!-- Aquí se cargarán los datos de los usuarios -->
        </tbody>
    </table>

    <a href="https://zanahorio326.github.io/Mal-comienzo/chat.html" class="boton">Ir al chat</a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRCo_R7EOod4IE67GlSLNrO3WEOOVMLrQ",
            authDomain: "thegame-5afaa.firebaseapp.com",
            databaseURL: "https://thegame-5afaa-default-rtdb.firebaseio.com",
            projectId: "thegame-5afaa",
            storageBucket: "thegame-5afaa.firebasestorage.app",
            messagingSenderId: "588556182984",
            appId: "1:588556182984:web:a0557067d35c18e3944cfd",
            measurementId: "G-9M3CBJ3LV9"
        };

        // Inicialización de Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Función para calcular el prestigio
        function calcularPrestigio(inventory) {
            const puntosPorMineral = {
                "Carbón": 1,
                "Cobre": 2,
                "Hierro": 5,
                "Plata": 10,
                "Oro": 20,
                "Madera": 15
            };

            let prestigio = 0;
            for (const mineral in inventory) {
                prestigio += inventory[mineral] * (puntosPorMineral[mineral] || 0);
            }
            return prestigio;
        }

        // Función para mostrar la tabla de prestigio con animaciones
        function mostrarPrestigio() {
            const tablaPrestigio = document.getElementById("tablaPrestigio");
            const usersRef = ref(db, 'users/');

            get(usersRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const usuarios = snapshot.val();
                    const usuariosArray = [];

                    for (const username in usuarios) {
                        const inventory = usuarios[username].inventory || {
                            Carbón: 0,
                            Cobre: 0,
                            Hierro: 0,
                            Plata: 0,
                            Oro: 0,
                            Madera: 0
                        };

                        const prestigio = calcularPrestigio(inventory);
                        usuariosArray.push({ username, prestigio });
                    }

                    // Ordenar los usuarios por prestigio (de mayor a menor)
                    usuariosArray.sort((a, b) => b.prestigio - a.prestigio);

                    // Limpiar la tabla actual
                    tablaPrestigio.innerHTML = '';

                    // Agregar las filas ordenadas con animación
                    usuariosArray.forEach((usuario, index) => {
                        const fila = document.createElement("tr");

                        const celdaNombre = document.createElement("td");
                        celdaNombre.textContent = usuario.username;
                        fila.appendChild(celdaNombre);

                        const celdaPrestigio = document.createElement("td");
                        celdaPrestigio.textContent = "0"; // Inicia en 0 para animar después
                        fila.appendChild(celdaPrestigio);

                        // Animación de aparición
                        fila.style.opacity = "0";
                        setTimeout(() => {
                            fila.style.animation = `aparecer 0.5s ease forwards`;
                        }, index * 200); // Retraso escalonado

                        tablaPrestigio.appendChild(fila);

                        // Animación de conteo después de la animación de aparición
                        setTimeout(() => {
                            animarNumero(celdaPrestigio, usuario.prestigio);
                        }, (index + 1) * 200); // Comienza después de la aparición
                    });
                } else {
                    console.log("No se encontraron datos para los usuarios.");
                }
            }).catch((error) => {
                console.error("Error al obtener los datos de los usuarios: ", error);
            });
        }

        // Función para animar el conteo de prestigio
        function animarNumero(elemento, valorFinal) {
            let valorActual = 0;
            const duracion = 1000; // 1 segundo
            const incremento = Math.ceil(valorFinal / (duracion / 16)); // Ajuste a 60 FPS

            function actualizarNumero() {
                valorActual += incremento;
                if (valorActual >= valorFinal) {
                    elemento.textContent = valorFinal; // Asegura que no pase el valor final
                } else {
                    elemento.textContent = valorActual;
                    requestAnimationFrame(actualizarNumero);
                }
            }

            requestAnimationFrame(actualizarNumero);
        }

        // Cargar la tabla de prestigio al cargar la página
        document.addEventListener("DOMContentLoaded", mostrarPrestigio);
    </script>
</body>
</html>
